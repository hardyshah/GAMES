<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park Tycoon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0e14;color:#e0e8f0;overflow:hidden;height:100vh}
#app{display:flex;height:100vh}
#sidebar{width:280px;background:#111820;border-right:2px solid #1e2a38;display:flex;flex-direction:column;overflow:hidden;z-index:10}
#sidebar-top{padding:12px;background:#0d1218}
#sidebar h1{font-size:22px;color:#ffcb3d;margin-bottom:2px;text-shadow:0 0 10px #ffcb3d44}
#sidebar .tagline{font-size:11px;color:#5a7a94}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.stat-box{background:#0a1018;border:1px solid #1a2634;border-radius:6px;padding:6px 8px}
.stat-label{font-size:10px;color:#5a7a94;text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:15px;font-weight:700;color:#e0e8f0}
.stat-val.money{color:#4ade80}
.stat-val.rating{color:#ffcb3d}
#tabs{display:flex;background:#0d1218;border-bottom:1px solid #1e2a38}
.tab{flex:1;padding:8px 4px;text-align:center;font-size:11px;color:#5a7a94;cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.tab:hover{color:#a0b8cc}
.tab.active{color:#ffcb3d;border-bottom-color:#ffcb3d}
#tab-content{flex:1;overflow-y:auto;padding:8px}
#tab-content::-webkit-scrollbar{width:5px}
#tab-content::-webkit-scrollbar-thumb{background:#1e2a38;border-radius:3px}
.build-cat{margin-bottom:12px}
.build-cat-title{font-size:10px;color:#5a7a94;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;padding:0 4px}
.build-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:1px solid #1a2634;border-radius:6px;background:#0f1820;color:#c0d0e0;cursor:pointer;font-size:12px;margin-bottom:4px;transition:.15s}
.build-btn:hover{background:#162030;border-color:#2a3e54}
.build-btn.active{background:#1a2a18;border-color:#4ade80;color:#4ade80}
.build-btn.locked{opacity:.4;cursor:not-allowed}
.build-btn .icon{font-size:20px;width:28px;text-align:center}
.build-btn .info{flex:1}
.build-btn .bname{font-weight:600}
.build-btn .cost{font-size:10px;color:#5a7a94}
.research-item{background:#0f1820;border:1px solid #1a2634;border-radius:6px;padding:8px;margin-bottom:6px}
.research-item.unlocked{border-color:#4ade80}
.research-item .r-name{font-size:12px;font-weight:600;color:#e0e8f0}
.research-item .r-desc{font-size:10px;color:#5a7a94;margin:2px 0}
.research-item .r-cost{font-size:11px;color:#ffcb3d}
.r-btn{padding:4px 10px;border:1px solid #2a3e54;border-radius:4px;background:#162030;color:#e0e8f0;cursor:pointer;font-size:11px;margin-top:4px}
.r-btn:hover{background:#1e3040}
.r-btn:disabled{opacity:.4;cursor:not-allowed}
.guest-panel{background:#0f1820;border:1px solid #1a2634;border-radius:6px;padding:8px;margin-bottom:6px;font-size:12px}
.guest-panel .g-name{font-weight:600;color:#ffcb3d}
.bar-bg{height:6px;background:#0a1018;border-radius:3px;margin:3px 0}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
#main{flex:1;position:relative;background:#1a2a18}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;display:flex;gap:8px;z-index:5}
.hud-btn{padding:6px 14px;background:#111820dd;border:1px solid #1e2a38;border-radius:6px;color:#c0d0e0;cursor:pointer;font-size:12px;backdrop-filter:blur(4px)}
.hud-btn:hover{background:#1a2838dd}
.hud-btn.active{border-color:#ffcb3d;color:#ffcb3d}
#speed-display{position:absolute;top:10px;right:10px;padding:6px 14px;background:#111820dd;border:1px solid #1e2a38;border-radius:6px;color:#ffcb3d;font-size:12px;backdrop-filter:blur(4px);z-index:5}
#msg{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);padding:8px 20px;background:#111820ee;border:1px solid #1e2a38;border-radius:8px;color:#e0e8f0;font-size:13px;backdrop-filter:blur(4px);z-index:5;pointer-events:none;opacity:0;transition:opacity .3s}
#msg.show{opacity:1}
#tooltip{position:absolute;display:none;background:#0d1218ee;border:1px solid #1e2a38;border-radius:6px;padding:8px 12px;font-size:12px;color:#e0e8f0;pointer-events:none;z-index:20;backdrop-filter:blur(4px);max-width:220px}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
  <div id="sidebar-top">
    <h1>🎢 Park Tycoon</h1>
    <div class="tagline">Build your dream theme park</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">Cash</div><div class="stat-val money" id="s-money">$15,000</div></div>
      <div class="stat-box"><div class="stat-label">Guests</div><div class="stat-val" id="s-guests">0</div></div>
      <div class="stat-box"><div class="stat-label">Park Rating</div><div class="stat-val rating" id="s-rating">500</div></div>
      <div class="stat-box"><div class="stat-label">Month</div><div class="stat-val" id="s-month">Mar Y1</div></div>
    </div>
  </div>
  <div id="tabs">
    <div class="tab active" data-tab="build">Build</div>
    <div class="tab" data-tab="research">Research</div>
    <div class="tab" data-tab="finance">Finance</div>
    <div class="tab" data-tab="guests">Guests</div>
  </div>
  <div id="tab-content"></div>
</div>
<div id="main">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-btn" id="btn-pause">⏸ Pause</div>
    <div class="hud-btn" id="btn-speed">▶▶ Fast</div>
    <div class="hud-btn" id="btn-demolish">💥 Demolish</div>
  </div>
  <div id="speed-display">▶ Normal</div>
  <div id="msg"></div>
  <div id="tooltip"></div>
</div>
</div>

<script>
// ============================================
// PARK TYCOON — Full Featured Theme Park Sim
// ============================================

const C = document.getElementById('game');
const ctx = C.getContext('2d');

const COLS = 48, ROWS = 48;
const ISO_W = 48, ISO_H = 24;
const HALF_W = ISO_W/2, HALF_H = ISO_H/2;

let G = {
  grid: [], buildings: [], guests: [],
  money: 15000, month: 0, day: 0, tick: 0,
  speed: 1, parkRating: 500, parkValue: 0,
  totalGuests: 0, monthlyIncome: 0, monthlyExpense: 0,
  research: {}, tool: null, demolish: false,
  cameraX: 0, cameraY: 0, zoom: 1,
  dragStart: null, dragCam: null, hover: null,
  guestId: 0, msgTimer: 0,
  entrance: {col:24, row:47},
  weather: 'sunny', weatherTimer: 0,
  loan: 0, maxLoan: 20000, loanInterest: 0.05,
};

const TERRAIN = {GRASS:0, PATH:1, WATER:2, TREE:3};

const BLDG = {
  carousel:{name:'Carousel',cat:'gentle',cost:800,upkeep:15,excitement:20,intensity:8,nausea:5,capacity:8,icon:'🎠',w:2,h:2,color:'#d94070',unlocked:true},
  ferris:{name:'Ferris Wheel',cat:'gentle',cost:1800,upkeep:25,excitement:35,intensity:10,nausea:3,capacity:12,icon:'🎡',w:2,h:2,color:'#6a5acd',unlocked:true},
  teacups:{name:'Tea Cups',cat:'gentle',cost:600,upkeep:12,excitement:15,intensity:12,nausea:15,capacity:6,icon:'☕',w:1,h:1,color:'#e87070',unlocked:true},
  train:{name:'Mini Train',cat:'gentle',cost:1200,upkeep:20,excitement:25,intensity:5,nausea:2,capacity:10,icon:'🚂',w:2,h:1,color:'#70b070',unlocked:true},
  coaster_wood:{name:'Wooden Coaster',cat:'thrill',cost:4500,upkeep:60,excitement:65,intensity:55,nausea:25,capacity:20,icon:'🎢',w:3,h:3,color:'#a0522d',research:'coaster_wood'},
  coaster_steel:{name:'Steel Coaster',cat:'thrill',cost:8000,upkeep:90,excitement:80,intensity:70,nausea:30,capacity:24,icon:'🎢',w:3,h:3,color:'#708090',research:'coaster_steel'},
  drop_tower:{name:'Drop Tower',cat:'thrill',cost:3500,upkeep:45,excitement:55,intensity:65,nausea:20,capacity:8,icon:'🗼',w:1,h:1,color:'#4682b4',research:'drop_tower'},
  swing:{name:'Pirate Ship',cat:'thrill',cost:2200,upkeep:30,excitement:40,intensity:45,nausea:20,capacity:12,icon:'⛵',w:2,h:1,color:'#8b4513',research:'pirate_ship'},
  log_flume:{name:'Log Flume',cat:'water',cost:5000,upkeep:55,excitement:50,intensity:35,nausea:10,capacity:6,icon:'🪵',w:3,h:2,color:'#2e8b57',research:'log_flume'},
  rapids:{name:'River Rapids',cat:'water',cost:6500,upkeep:70,excitement:60,intensity:40,nausea:15,capacity:8,icon:'🌊',w:3,h:3,color:'#1e90ff',research:'rapids'},
  food:{name:'Burger Joint',cat:'shop',cost:400,upkeep:10,icon:'🍔',w:1,h:1,color:'#daa520',unlocked:true,shop:'hunger'},
  drink:{name:'Drink Stand',cat:'shop',cost:300,upkeep:8,icon:'🥤',w:1,h:1,color:'#4fb3d9',unlocked:true,shop:'thirst'},
  icecream:{name:'Ice Cream Shop',cat:'shop',cost:500,upkeep:12,icon:'🍦',w:1,h:1,color:'#ff69b4',research:'icecream',shop:'hunger'},
  bathroom:{name:'Restroom',cat:'shop',cost:250,upkeep:8,icon:'🚻',w:1,h:1,color:'#5faa8f',unlocked:true,shop:'toilet'},
  souvenir:{name:'Souvenir Shop',cat:'shop',cost:600,upkeep:15,icon:'🎁',w:1,h:1,color:'#da70d6',research:'souvenir',shop:'souvenir'},
  tree_small:{name:'Small Tree',cat:'scenery',cost:30,upkeep:0,icon:'🌳',w:1,h:1,color:'#2d6a30',unlocked:true,scenery:true},
  tree_big:{name:'Big Oak',cat:'scenery',cost:80,upkeep:0,icon:'🌲',w:1,h:1,color:'#1a4d1e',unlocked:true,scenery:true},
  flowers:{name:'Flower Bed',cat:'scenery',cost:50,upkeep:2,icon:'🌸',w:1,h:1,color:'#d970a0',unlocked:true,scenery:true},
  fountain:{name:'Fountain',cat:'scenery',cost:300,upkeep:5,icon:'⛲',w:1,h:1,color:'#4488cc',research:'fountain',scenery:true},
  statue:{name:'Statue',cat:'scenery',cost:500,upkeep:0,icon:'🗿',w:1,h:1,color:'#888899',research:'statue',scenery:true},
  lamp:{name:'Lamp Post',cat:'scenery',cost:40,upkeep:1,icon:'💡',w:1,h:1,color:'#ccaa44',unlocked:true,scenery:true},
  bench:{name:'Bench',cat:'scenery',cost:25,upkeep:0,icon:'🪑',w:1,h:1,color:'#8b6914',unlocked:true,scenery:true},
  path:{name:'Footpath',cat:'infra',cost:15,upkeep:0,icon:'🛤️',w:1,h:1,color:'#b0a080',unlocked:true,isPath:true},
  wide_path:{name:'Wide Path',cat:'infra',cost:40,upkeep:1,icon:'🛤️',w:1,h:1,color:'#c0b090',research:'wide_path',isPath:true},
};

const RESEARCH = [
  {id:'coaster_wood',name:'Wooden Coasters',desc:'Unlock classic wooden roller coasters',cost:2000,icon:'🎢'},
  {id:'drop_tower',name:'Drop Tower',desc:'Unlock thrilling vertical drop rides',cost:1500,icon:'🗼'},
  {id:'pirate_ship',name:'Pirate Ship',desc:'Unlock swinging ship rides',cost:1200,icon:'⛵'},
  {id:'coaster_steel',name:'Steel Coasters',desc:'Unlock modern steel roller coasters',cost:5000,icon:'🎢',requires:'coaster_wood'},
  {id:'log_flume',name:'Log Flume',desc:'Unlock log flume water rides',cost:3000,icon:'🪵'},
  {id:'rapids',name:'River Rapids',desc:'Unlock river rapids rides',cost:4000,icon:'🌊',requires:'log_flume'},
  {id:'icecream',name:'Ice Cream',desc:'Unlock ice cream shops',cost:500,icon:'🍦'},
  {id:'souvenir',name:'Souvenirs',desc:'Unlock souvenir shops',cost:800,icon:'🎁'},
  {id:'fountain',name:'Fountains',desc:'Unlock decorative fountains',cost:600,icon:'⛲'},
  {id:'statue',name:'Statues',desc:'Unlock park statues',cost:1000,icon:'🗿'},
  {id:'wide_path',name:'Wide Paths',desc:'Wider paths reduce crowding',cost:400,icon:'🛤️'},
  {id:'marketing1',name:'Local Ads',desc:'+20% guest attraction rate',cost:1500,icon:'📰'},
  {id:'marketing2',name:'TV Campaign',desc:'+40% guest attraction rate',cost:4000,icon:'📺',requires:'marketing1'},
];

const FIRST_NAMES=['Alex','Sam','Jordan','Casey','Riley','Morgan','Quinn','Avery','Blake','Cameron','Drew','Eden','Frankie','Gray','Harper','Indi','Jamie','Kai','Lane','Max','Nico','Oakley','Parker','Reese','Sage','Taylor','Val','Winter'];
const LAST_NAMES=['Smith','Park','River','Stone','Wood','Green','Hill','Lake','Snow','Storm','Field','Moon','Star','Fox','Wolf','Crane','Reed','Brook','Vale','Dale'];

function initGrid(){
  G.grid=[];
  for(let r=0;r<ROWS;r++){
    G.grid[r]=[];
    for(let c=0;c<COLS;c++) G.grid[r][c]={terrain:TERRAIN.GRASS,building:null,pathType:null};
  }
  for(let i=44;i<ROWS;i++){G.grid[i][24].terrain=TERRAIN.PATH;G.grid[i][24].pathType='path';}
  for(let i=0;i<120;i++){
    let r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);
    if(G.grid[r][c].terrain===TERRAIN.GRASS&&!(r>42&&c===24)) G.grid[r][c].terrain=TERRAIN.TREE;
  }
  for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
    if(dr*dr+dc*dc<=5){let r=10+dr,c=10+dc;if(r>=0&&r<ROWS&&c>=0&&c<COLS)G.grid[r][c].terrain=TERRAIN.WATER;}
  }
}

function toIso(col,row){return{x:(col-row)*HALF_W,y:(col+row)*HALF_H};}
function toScreen(col,row){let i=toIso(col,row);return{x:i.x*G.zoom+G.cameraX+C.width/2,y:i.y*G.zoom+G.cameraY+C.height/2};}
function fromScreen(sx,sy){let x=(sx-C.width/2-G.cameraX)/G.zoom,y=(sy-C.height/2-G.cameraY)/G.zoom;return{col:Math.floor((x/HALF_W+y/HALF_H)/2),row:Math.floor((y/HALF_H-x/HALF_W)/2)};}

function resize(){C.width=C.parentElement.clientWidth;C.height=C.parentElement.clientHeight;}
window.addEventListener('resize',resize);

function darken(hex,amt){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.floor(r*(1-amt));g=Math.floor(g*(1-amt));b=Math.floor(b*(1-amt));return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

function drawTile(col,row,color,height){
  let p=toScreen(col,row),h=(height||0)*G.zoom,w=HALF_W*G.zoom,hh=HALF_H*G.zoom;
  ctx.beginPath();ctx.moveTo(p.x,p.y-h);ctx.lineTo(p.x+w,p.y+hh-h);ctx.lineTo(p.x,p.y+2*hh-h);ctx.lineTo(p.x-w,p.y+hh-h);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;ctx.stroke();
  if(h>0){
    ctx.beginPath();ctx.moveTo(p.x-w,p.y+hh-h);ctx.lineTo(p.x-w,p.y+hh);ctx.lineTo(p.x,p.y+2*hh);ctx.lineTo(p.x,p.y+2*hh-h);ctx.closePath();ctx.fillStyle=darken(color,0.25);ctx.fill();
    ctx.beginPath();ctx.moveTo(p.x,p.y+2*hh-h);ctx.lineTo(p.x,p.y+2*hh);ctx.lineTo(p.x+w,p.y+hh);ctx.lineTo(p.x+w,p.y+hh-h);ctx.closePath();ctx.fillStyle=darken(color,0.15);ctx.fill();
  }
}

function getTerrainColor(t,c,r){
  if(t===TERRAIN.PATH)return'#c8b88a';if(t===TERRAIN.WATER)return'#2266aa';if(t===TERRAIN.TREE)return'#2a7a32';
  let v=((c*7+r*13)%5)*3;return`rgb(${58+v},${120+v},${48+v})`;
}

function drawBuilding(b){
  let def=BLDG[b.type];if(!def)return;
  for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++) drawTile(b.col+dc,b.row+dr,def.color,def.scenery?4:8);
  let cx=b.col+def.w/2,cy=b.row+def.h/2,p=toScreen(cx,cy),sz=Math.max(14,20*G.zoom);
  ctx.font=sz+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(def.icon,p.x,p.y-(def.scenery?4:8)*G.zoom-2);
  if(b.queue&&b.queue.length>0&&!def.scenery&&!def.shop&&!def.isPath){
    ctx.font='bold '+Math.max(8,10*G.zoom)+'px sans-serif';ctx.fillStyle='#ffcb3d';
    ctx.fillText(b.queue.length+'👤',p.x,p.y-(def.scenery?4:8)*G.zoom-sz/2-8);
  }
}

function drawGuest(g){
  let p=toScreen(g.x,g.y),sz=Math.max(3,5*G.zoom);
  ctx.beginPath();ctx.ellipse(p.x,p.y+sz,sz*0.8,sz*0.3,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fill();
  ctx.beginPath();ctx.arc(p.x,p.y-sz,sz,0,Math.PI*2);ctx.fillStyle=g.color;ctx.fill();ctx.strokeStyle=darken(g.color,0.3);ctx.lineWidth=0.5;ctx.stroke();
  if(G.zoom>0.6){let mood=g.happiness>70?'😊':g.happiness>40?'😐':'😠';ctx.font=Math.max(8,9*G.zoom)+'px serif';ctx.textAlign='center';ctx.fillText(mood,p.x,p.y-sz*3);}
}

function drawEntrance(){
  drawTile(24,47,'#ffcb3d',6);let p=toScreen(24,47);
  ctx.font='bold '+Math.max(10,14*G.zoom)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#1a1a2e';ctx.fillText('ENTRANCE',p.x,p.y-6*G.zoom);
}

function drawWeather(){
  if(G.weather==='rainy')for(let i=0;i<40;i++){let x=Math.random()*C.width,y=Math.random()*C.height;ctx.strokeStyle='rgba(100,150,200,0.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+2,y+8);ctx.stroke();}
}

function drawHoverIndicator(){
  if(!G.hover)return;let{col,row}=G.hover;if(col<0||row<0||col>=COLS||row>=ROWS)return;
  if(G.tool){let def=BLDG[G.tool];if(def){let can=canPlaceAt(G.tool,col,row);
    for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++){
      let p=toScreen(col+dc,row+dr),w=HALF_W*G.zoom,hh=HALF_H*G.zoom;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+w,p.y+hh);ctx.lineTo(p.x,p.y+2*hh);ctx.lineTo(p.x-w,p.y+hh);ctx.closePath();
      ctx.fillStyle=can?'rgba(74,222,128,0.3)':'rgba(255,80,80,0.3)';ctx.fill();ctx.strokeStyle=can?'#4ade80':'#ff5050';ctx.lineWidth=1.5;ctx.stroke();
    }
  }}else if(G.demolish){let p=toScreen(col,row),w=HALF_W*G.zoom,hh=HALF_H*G.zoom;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+w,p.y+hh);ctx.lineTo(p.x,p.y+2*hh);ctx.lineTo(p.x-w,p.y+hh);ctx.closePath();ctx.fillStyle='rgba(255,80,80,0.3)';ctx.fill();}
}

function draw(){
  ctx.fillStyle='#1a2a18';ctx.fillRect(0,0,C.width,C.height);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    let t=G.grid[r][c],col=getTerrainColor(t.terrain,c,r);
    if(t.terrain===TERRAIN.WATER){let wave=Math.sin(Date.now()/800+c+r)*5;drawTile(c,r,col,wave>2?-0.5:0);}
    else if(t.terrain===TERRAIN.TREE){drawTile(c,r,'#3a8a42',0);let p=toScreen(c+0.5,r+0.5);ctx.font=Math.max(12,16*G.zoom)+'px serif';ctx.textAlign='center';ctx.fillText('🌳',p.x,p.y-4*G.zoom);}
    else drawTile(c,r,col,t.terrain===TERRAIN.PATH?1:0);
  }
  let allE=[];
  G.buildings.forEach(b=>allE.push({t:'b',d:b,z:b.col+b.row}));
  G.guests.forEach(g=>allE.push({t:'g',d:g,z:g.x+g.y}));
  allE.sort((a,b)=>a.z-b.z);
  allE.forEach(e=>{if(e.t==='b')drawBuilding(e.d);else drawGuest(e.d);});
  drawEntrance();drawHoverIndicator();drawWeather();
}

// --- PATHFINDING ---
function findPath(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return[{x:tx,y:ty}];
  let visited=new Set(),queue=[{x:Math.round(sx),y:Math.round(sy),path:[]}];
  visited.add(Math.round(sx)+','+Math.round(sy));
  let dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}],steps=0;
  while(queue.length>0&&steps<2000){
    steps++;let curr=queue.shift();
    for(let d of dirs){
      let nx=curr.x+d.x,ny=curr.y+d.y,key=nx+','+ny;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS||visited.has(key))continue;
      let tile=G.grid[ny][nx];if(tile.terrain!==TERRAIN.PATH&&!tile.pathType)continue;
      visited.add(key);let np=[...curr.path,{x:nx,y:ny}];
      if(nx===Math.round(tx)&&ny===Math.round(ty))return np;
      queue.push({x:nx,y:ny,path:np});
    }
  }
  return null;
}

function adjacentPaths(col,row,w,h){
  let paths=[];
  for(let dc=0;dc<w;dc++){if(row>0&&isPath(col+dc,row-1))paths.push({x:col+dc,y:row-1});if(row+h<ROWS&&isPath(col+dc,row+h))paths.push({x:col+dc,y:row+h});}
  for(let dr=0;dr<h;dr++){if(col>0&&isPath(col-1,row+dr))paths.push({x:col-1,y:row+dr});if(col+w<COLS&&isPath(col+w,row+dr))paths.push({x:col+w,y:row+dr});}
  return paths;
}

function isPath(c,r){return c>=0&&r>=0&&c<COLS&&r<ROWS&&(G.grid[r][c].terrain===TERRAIN.PATH||G.grid[r][c].pathType);}

// --- BUILDING ---
function canPlaceAt(type,col,row){
  let def=BLDG[type];if(!def)return false;
  for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++){
    let c2=col+dc,r2=row+dr;if(c2<0||r2<0||c2>=COLS||r2>=ROWS)return false;
    let tile=G.grid[r2][c2];
    if(def.isPath){if(tile.terrain===TERRAIN.WATER||tile.building)return false;}
    else{if(tile.terrain!==TERRAIN.GRASS&&tile.terrain!==TERRAIN.TREE)return false;if(tile.building)return false;}
  }
  if(!def.isPath&&!def.scenery&&adjacentPaths(col,row,def.w,def.h).length===0)return false;
  return true;
}

function placeBuild(type,col,row){
  let def=BLDG[type];if(!def)return;
  if(G.money<def.cost){showMsg('Not enough money!');return;}
  if(!canPlaceAt(type,col,row)){showMsg('Cannot build there.');return;}
  G.money-=def.cost;
  let b={type,col,row,id:Date.now()+Math.random(),queue:[],rideTimer:0,income:0};
  for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++){
    let tile=G.grid[row+dr][col+dc];
    if(def.isPath){tile.terrain=TERRAIN.PATH;tile.pathType=type;}else{tile.terrain=TERRAIN.GRASS;tile.building=b.id;}
  }
  if(!def.isPath)G.buildings.push(b);
  showMsg(def.name+' built for $'+def.cost);
}

function demolishAt(col,row){
  if(col<0||row<0||col>=COLS||row>=ROWS)return;let tile=G.grid[row][col];
  if(tile.building){
    let b=G.buildings.find(b2=>b2.id===tile.building);if(!b)return;let def=BLDG[b.type],refund=Math.floor(def.cost*0.3);G.money+=refund;
    for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++)G.grid[b.row+dr][b.col+dc].building=null;
    if(b.queue)b.queue.forEach(gid=>{let g=G.guests.find(g2=>g2.id===gid);if(g)g.state='wander';});
    G.buildings=G.buildings.filter(b2=>b2.id!==b.id);showMsg(def.name+' demolished. $'+refund+' refunded.');
  }else if(tile.terrain===TERRAIN.PATH){tile.terrain=TERRAIN.GRASS;tile.pathType=null;G.money+=5;showMsg('Path removed.');}
}

// --- GUESTS ---
function spawnGuest(){
  let g={id:G.guestId++,name:FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)]+' '+LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)],
    x:G.entrance.col,y:G.entrance.row,tx:G.entrance.col,ty:G.entrance.row,
    happiness:70+Math.random()*20,hunger:10+Math.random()*20,thirst:10+Math.random()*20,
    toilet:5+Math.random()*15,energy:80+Math.random()*20,nausea:0,
    money:40+Math.floor(Math.random()*60),
    color:`hsl(${Math.floor(Math.random()*360)},${55+Math.random()*20}%,${50+Math.random()*15}%)`,
    state:'wander',path:null,pathIdx:0,rideHistory:[],waitTimer:0,wanderTimer:0,thoughts:[],enteredAt:G.month};
  G.guests.push(g);G.totalGuests++;return g;
}

function guestThink(g){
  if(g.state==='riding'||g.state==='queuing'||g.state==='leaving')return;
  if(g.toilet>75){let s=findNearestShop(g,'toilet');if(s)return guestGoTo(g,s,'walking');}
  if(g.hunger>70){let s=findNearestShop(g,'hunger');if(s)return guestGoTo(g,s,'walking');}
  if(g.thirst>70){let s=findNearestShop(g,'thirst');if(s)return guestGoTo(g,s,'walking');}
  if(g.nausea>60){g.wanderTimer=30;return;}
  if(g.energy>20&&g.wanderTimer<=0){
    let rides=G.buildings.filter(b=>{let d=BLDG[b.type];return d&&!d.shop&&!d.scenery&&!d.isPath&&!g.rideHistory.includes(b.id)&&(!b.queue||b.queue.length<d.capacity);});
    if(rides.length>0){
      rides.sort((a,b)=>{let da=BLDG[a.type],db=BLDG[b.type];return(db.excitement-(b.queue?b.queue.length*3:0))-(da.excitement-(a.queue?a.queue.length*3:0));});
      return guestGoTo(g,rides[Math.random()<0.7?0:Math.floor(Math.random()*Math.min(3,rides.length))],'walking');
    }
  }
  if(g.wanderTimer<=0){
    let paths=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(isPath(c,r)&&Math.random()<0.02)paths.push({x:c,y:r});
    if(paths.length>0){let dest=paths[Math.floor(Math.random()*paths.length)],p=findPath(g.x,g.y,dest.x,dest.y);if(p){g.path=p;g.pathIdx=0;g.state='wander';}}
    g.wanderTimer=30+Math.random()*40;
  }
}

function findNearestShop(g,need){
  let shops=G.buildings.filter(b=>{let d=BLDG[b.type];return d&&d.shop===need;});if(!shops.length)return null;
  shops.sort((a,b)=>(Math.abs(a.col-g.x)+Math.abs(a.row-g.y))-(Math.abs(b.col-g.x)+Math.abs(b.row-g.y)));return shops[0];
}

function guestGoTo(g,building,state){
  let def=BLDG[building.type],adj=adjacentPaths(building.col,building.row,def.w,def.h);if(!adj.length)return;
  let target=adj[Math.floor(Math.random()*adj.length)],path=findPath(g.x,g.y,target.x,target.y);
  if(path){g.path=path;g.pathIdx=0;g.state=state;g.targetBuilding=building.id;}
}

function updateGuest(g,dt){
  let spd=2.5*dt;
  g.hunger=Math.min(100,g.hunger+0.15*dt);g.thirst=Math.min(100,g.thirst+0.2*dt);
  g.toilet=Math.min(100,g.toilet+0.1*dt);g.nausea=Math.max(0,g.nausea-0.05*dt);
  if(g.wanderTimer>0)g.wanderTimer-=dt;
  let hMod=0;
  if(g.hunger>70)hMod-=0.2*dt;if(g.thirst>70)hMod-=0.25*dt;if(g.toilet>80)hMod-=0.3*dt;if(g.nausea>40)hMod-=0.2*dt;
  let nearScenery=0;for(let b of G.buildings){let d=BLDG[b.type];if(d&&d.scenery&&Math.abs(b.col-g.x)+Math.abs(b.row-g.y)<4)nearScenery++;}
  if(nearScenery>0)hMod+=0.05*Math.min(nearScenery,5)*dt;
  if(G.weather==='rainy')hMod-=0.15*dt;
  g.happiness=Math.max(0,Math.min(100,g.happiness+hMod));

  if(g.path&&g.pathIdx<g.path.length){
    let target=g.path[g.pathIdx],dx=target.x-g.x,dy=target.y-g.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<spd){g.x=target.x;g.y=target.y;g.pathIdx++;}else{g.x+=dx/dist*spd;g.y+=dy/dist*spd;}
  }else if(g.path&&g.pathIdx>=g.path.length){
    g.path=null;
    if(g.targetBuilding){
      let b=G.buildings.find(b2=>b2.id===g.targetBuilding);
      if(b){let def=BLDG[b.type];
        if(def.shop){
          let price=def.shop==='souvenir'?8:def.shop==='hunger'?6:def.shop==='thirst'?4:2;
          if(g.money>=price){g.money-=price;b.income=(b.income||0)+price;G.money+=price;
            if(def.shop==='hunger')g.hunger=Math.max(0,g.hunger-60);if(def.shop==='thirst')g.thirst=Math.max(0,g.thirst-60);
            if(def.shop==='toilet')g.toilet=0;if(def.shop==='souvenir')g.happiness=Math.min(100,g.happiness+10);
            g.happiness=Math.min(100,g.happiness+5);}
          g.state='wander';
        }else if(!def.scenery&&!def.isPath){if(!b.queue)b.queue=[];if(b.queue.length<def.capacity){b.queue.push(g.id);g.state='queuing';}else g.state='wander';}
      }
      g.targetBuilding=null;
    }else g.state='wander';
  }
  if(g.state==='queuing'){g.waitTimer+=dt;if(g.waitTimer>60){for(let b of G.buildings)if(b.queue)b.queue=b.queue.filter(id=>id!==g.id);g.state='wander';g.waitTimer=0;g.happiness=Math.max(0,g.happiness-5);}}
  if(g.state==='wander'&&(!g.path||g.pathIdx>=g.path.length))guestThink(g);
  if(g.happiness<15||(g.money<2&&g.hunger>60)){g.state='leaving';let p=findPath(g.x,g.y,G.entrance.col,G.entrance.row);if(p){g.path=p;g.pathIdx=0;}else g.remove=true;}
  if(g.state==='leaving'&&(!g.path||g.pathIdx>=g.path.length))g.remove=true;
}

function updateRides(dt){
  for(let b of G.buildings){
    let def=BLDG[b.type];if(!def||def.shop||def.scenery||def.isPath)continue;if(!b.queue)b.queue=[];
    b.rideTimer+=dt;let cycleDuration=12+(def.excitement||0)*0.1;
    if(b.rideTimer>=cycleDuration&&b.queue.length>0){
      b.rideTimer=0;let riders=b.queue.splice(0,Math.min(b.queue.length,def.capacity)),price=Math.round(def.excitement*0.15+2);
      riders.forEach(gid=>{let g=G.guests.find(g2=>g2.id===gid);if(g){
        if(g.money>=price){g.money-=price;b.income=(b.income||0)+price;G.money+=price;}
        g.happiness=Math.min(100,g.happiness+def.excitement*0.3);g.nausea=Math.min(100,g.nausea+def.nausea*0.4);
        g.energy=Math.max(0,g.energy-def.intensity*0.2);g.rideHistory.push(b.id);g.state='wander';g.waitTimer=0;
      }});
    }
  }
}

function monthTick(){
  G.month++;let expense=0;
  for(let b of G.buildings){let d=BLDG[b.type];if(d)expense+=d.upkeep;}
  if(G.loan>0)expense+=Math.floor(G.loan*G.loanInterest/12);
  G.money-=expense;G.monthlyExpense=expense;
  let r=Math.random();G.weather=r<0.6?'sunny':r<0.85?'cloudy':'rainy';
  G.parkValue=0;for(let b of G.buildings){let d=BLDG[b.type];if(d)G.parkValue+=d.cost;}
  let avgH=G.guests.length>0?G.guests.reduce((s,g)=>s+g.happiness,0)/G.guests.length:50;
  let rc=G.buildings.filter(b=>{let d=BLDG[b.type];return d&&!d.shop&&!d.scenery&&!d.isPath;}).length;
  let sc=G.buildings.filter(b=>{let d=BLDG[b.type];return d&&d.shop;}).length;
  let sn=G.buildings.filter(b=>{let d=BLDG[b.type];return d&&d.scenery;}).length;
  G.parkRating=Math.max(0,Math.min(999,Math.round(avgH*3+Math.min(rc*25,200)+Math.min(sc*15,100)+Math.min(sn*5,50)+Math.min(G.guests.length*2,100))));
  updateStats();
}

function getSpawnRate(){
  let base=0.02,rm=G.parkRating/500,rb=Math.min(G.buildings.filter(b=>{let d=BLDG[b.type];return d&&!d.shop&&!d.scenery&&!d.isPath;}).length*0.005,0.03);
  if(G.research.marketing1)base*=1.2;if(G.research.marketing2)base*=1.4;if(G.weather==='rainy')base*=0.5;
  return base*rm+rb;
}

function update(dt){
  if(G.speed===0)return;let gameDt=dt*G.speed*3;G.tick+=gameDt;
  if(Math.random()<getSpawnRate()*gameDt&&G.guests.length<150)spawnGuest();
  for(let g of G.guests)updateGuest(g,gameDt);G.guests=G.guests.filter(g=>!g.remove);
  updateRides(gameDt);
  G.day+=gameDt*0.03;if(G.day>=30){G.day=0;monthTick();}
  if(G.msgTimer>0){G.msgTimer-=dt;if(G.msgTimer<=0)document.getElementById('msg').classList.remove('show');}
}

// --- UI ---
function showMsg(text){document.getElementById('msg').textContent=text;document.getElementById('msg').classList.add('show');G.msgTimer=3;}
function getMonthName(){let m=['Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb'];return m[G.month%12]+' Y'+(Math.floor(G.month/12)+1);}
function updateStats(){
  document.getElementById('s-money').textContent='$'+Math.round(G.money).toLocaleString();
  document.getElementById('s-guests').textContent=G.guests.length;
  document.getElementById('s-rating').textContent=G.parkRating;
  document.getElementById('s-month').textContent=getMonthName();
  document.getElementById('s-money').style.color=G.money<0?'#ff5050':'#4ade80';
}
function isUnlocked(type){let d=BLDG[type];if(!d)return false;if(d.unlocked)return true;if(d.research)return!!G.research[d.research];return false;}

function renderBuildTab(){
  let cats={'Paths & Infra':['path','wide_path'],'Gentle Rides':['carousel','ferris','teacups','train'],'Thrill Rides':['coaster_wood','coaster_steel','drop_tower','swing'],'Water Rides':['log_flume','rapids'],'Shops & Facilities':['food','drink','icecream','bathroom','souvenir'],'Scenery':['tree_small','tree_big','flowers','fountain','statue','lamp','bench']};
  let html='';for(let cat in cats){html+='<div class="build-cat"><div class="build-cat-title">'+cat+'</div>';
    for(let type of cats[cat]){let def=BLDG[type],unlocked=isUnlocked(type),active=G.tool===type;
      html+='<button class="build-btn'+(active?' active':'')+(unlocked?'':' locked')+'" data-type="'+type+'" '+(unlocked?'':'disabled')+'>';
      html+='<div class="icon">'+def.icon+'</div><div class="info"><div class="bname">'+def.name+(unlocked?'':' 🔒')+'</div>';
      html+='<div class="cost">$'+def.cost;if(def.excitement)html+=' · E:'+def.excitement+' I:'+def.intensity+' N:'+def.nausea;
      html+='</div></div></button>';}html+='</div>';}return html;
}

function renderResearchTab(){
  let html='';for(let r of RESEARCH){let unlocked=!!G.research[r.id],available=!r.requires||!!G.research[r.requires];
    html+='<div class="research-item'+(unlocked?' unlocked':'')+'"><div class="r-name">'+r.icon+' '+r.name+(unlocked?' ✅':'')+'</div>';
    html+='<div class="r-desc">'+r.desc+'</div>';
    if(!unlocked){html+='<div class="r-cost">$'+r.cost+(r.requires&&!G.research[r.requires]?' (requires '+RESEARCH.find(x=>x.id===r.requires).name+')':'')+'</div>';
      html+='<button class="r-btn" data-rid="'+r.id+'" '+(available&&G.money>=r.cost?'':'disabled')+'>Research</button>';}
    html+='</div>';}return html;
}

function renderFinanceTab(){
  let ri=0,si=0;for(let b of G.buildings){let d=BLDG[b.type];if(d&&!d.shop&&!d.scenery&&!d.isPath)ri+=(b.income||0);if(d&&d.shop)si+=(b.income||0);}
  let up=0;for(let b of G.buildings){let d=BLDG[b.type];if(d)up+=d.upkeep;}
  return'<div class="guest-panel"><div class="g-name">💰 Financial Summary</div><div style="margin-top:6px;font-size:12px;line-height:1.8">'+
    'Park Value: <b>$'+G.parkValue.toLocaleString()+'</b><br>Total Guests: <b>'+G.totalGuests+'</b><br>'+
    'Ride Revenue: <b style="color:#4ade80">$'+Math.round(ri).toLocaleString()+'</b><br>'+
    'Shop Revenue: <b style="color:#4ade80">$'+Math.round(si).toLocaleString()+'</b><br>'+
    'Monthly Upkeep: <b style="color:#ff7070">-$'+up+'/mo</b><br>'+
    'Weather: <b>'+(G.weather==='sunny'?'☀️ Sunny':G.weather==='cloudy'?'☁️ Cloudy':'🌧️ Rainy')+'</b><br>'+
    '<hr style="border-color:#1e2a38;margin:6px 0">Loan: <b>$'+G.loan.toLocaleString()+'</b> / $'+G.maxLoan.toLocaleString()+'<br></div>'+
    '<button class="r-btn" id="btn-borrow" '+(G.loan>=G.maxLoan?'disabled':'')+'>Borrow $1,000</button>'+
    '<button class="r-btn" id="btn-repay" '+(G.loan<=0||G.money<1000?'disabled':'')+'>Repay $1,000</button></div>';
}

function renderGuestsTab(){
  if(!G.guests.length)return'<div style="padding:12px;color:#5a7a94;font-size:12px">No guests in park yet. Build paths and rides near the entrance!</div>';
  let html='',shown=G.guests.slice(0,20);
  for(let g of shown){html+='<div class="guest-panel"><div class="g-name" style="color:'+g.color+'">'+g.name+'</div>';
    html+='<div style="font-size:11px;color:#5a7a94">$'+Math.round(g.money)+' · '+(g.state==='queuing'?'In queue':g.state==='riding'?'Riding':g.state==='leaving'?'Leaving':'Exploring')+'</div>';
    html+=bar('Happy',g.happiness,'#4ade80')+bar('Hunger',g.hunger,'#daa520')+bar('Thirst',g.thirst,'#4fb3d9')+bar('Energy',g.energy,'#a78bfa')+'</div>';}
  if(G.guests.length>20)html+='<div style="color:#5a7a94;font-size:11px;padding:4px">...and '+(G.guests.length-20)+' more guests</div>';return html;
}

function bar(label,val,color){
  return'<div style="display:flex;align-items:center;gap:4px;font-size:10px;margin-top:2px"><span style="width:40px;color:#5a7a94">'+label+'</span>'+
    '<div class="bar-bg" style="flex:1"><div class="bar-fill" style="width:'+Math.round(val)+'%;background:'+color+'"></div></div>'+
    '<span style="width:24px;text-align:right">'+Math.round(val)+'</span></div>';
}

let currentTab='build';
function renderTab(){
  let el=document.getElementById('tab-content');
  switch(currentTab){
    case'build':el.innerHTML=renderBuildTab();bindBuildButtons();break;
    case'research':el.innerHTML=renderResearchTab();bindResearchButtons();break;
    case'finance':el.innerHTML=renderFinanceTab();bindFinanceButtons();break;
    case'guests':el.innerHTML=renderGuestsTab();break;
  }
}

function bindBuildButtons(){document.querySelectorAll('.build-btn').forEach(btn=>{btn.addEventListener('click',()=>{
  G.demolish=false;document.getElementById('btn-demolish').classList.remove('active');
  if(G.tool===btn.dataset.type)G.tool=null;else G.tool=btn.dataset.type;renderTab();});});}

function bindResearchButtons(){document.querySelectorAll('.r-btn[data-rid]').forEach(btn=>{btn.addEventListener('click',()=>{
  let rid=btn.dataset.rid,r=RESEARCH.find(x=>x.id===rid);
  if(r&&G.money>=r.cost&&!G.research[rid]){G.money-=r.cost;G.research[rid]=true;showMsg(r.name+' researched!');renderTab();updateStats();}});});}

function bindFinanceButtons(){
  let bb=document.getElementById('btn-borrow'),br=document.getElementById('btn-repay');
  if(bb)bb.addEventListener('click',()=>{if(G.loan<G.maxLoan){G.loan+=1000;G.money+=1000;showMsg('Borrowed $1,000');renderTab();updateStats();}});
  if(br)br.addEventListener('click',()=>{if(G.loan>0&&G.money>=1000){G.loan-=1000;G.money-=1000;showMsg('Repaid $1,000');renderTab();updateStats();}});
}

document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');currentTab=tab.dataset.tab;renderTab();});});

document.getElementById('btn-pause').addEventListener('click',()=>{G.speed=G.speed===0?1:0;document.getElementById('btn-pause').textContent=G.speed===0?'▶ Play':'⏸ Pause';updateSpeedDisplay();});
document.getElementById('btn-speed').addEventListener('click',()=>{if(G.speed===0)G.speed=1;else if(G.speed===1)G.speed=2;else if(G.speed===2)G.speed=3;else G.speed=1;updateSpeedDisplay();});
document.getElementById('btn-demolish').addEventListener('click',()=>{G.demolish=!G.demolish;if(G.demolish)G.tool=null;document.getElementById('btn-demolish').classList.toggle('active',G.demolish);renderTab();});

function updateSpeedDisplay(){document.getElementById('speed-display').textContent=G.speed===0?'⏸ Paused':G.speed===1?'▶ Normal':G.speed===2?'▶▶ Fast':'▶▶▶ Ultra';}

let isDragging=false,mouseDown=false,lastMouse={x:0,y:0};

C.addEventListener('mousedown',e=>{mouseDown=true;isDragging=false;lastMouse={x:e.clientX,y:e.clientY};G.dragStart={x:e.clientX,y:e.clientY};G.dragCam={x:G.cameraX,y:G.cameraY};});
C.addEventListener('mousemove',e=>{
  let rect=C.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;G.hover=fromScreen(mx,my);
  if(mouseDown){let dx=e.clientX-G.dragStart.x,dy=e.clientY-G.dragStart.y;if(Math.abs(dx)>3||Math.abs(dy)>3)isDragging=true;if(isDragging){G.cameraX=G.dragCam.x+dx;G.cameraY=G.dragCam.y+dy;}}
  if(mouseDown&&!isDragging&&G.tool&&BLDG[G.tool]&&BLDG[G.tool].isPath){let{col,row}=fromScreen(mx,my);if(col>=0&&row>=0&&col<COLS&&row<ROWS)placeBuild(G.tool,col,row);}
});
C.addEventListener('mouseup',e=>{
  if(!isDragging){let rect=C.getBoundingClientRect(),{col,row}=fromScreen(e.clientX-rect.left,e.clientY-rect.top);
    if(col>=0&&row>=0&&col<COLS&&row<ROWS){if(G.demolish)demolishAt(col,row);else if(G.tool)placeBuild(G.tool,col,row);}}
  mouseDown=false;isDragging=false;
});
C.addEventListener('wheel',e=>{e.preventDefault();let oldZ=G.zoom;G.zoom*=e.deltaY>0?0.92:1.08;G.zoom=Math.max(0.3,Math.min(2.5,G.zoom));
  let rect=C.getBoundingClientRect(),mx=e.clientX-rect.left-C.width/2,my=e.clientY-rect.top-C.height/2;
  G.cameraX=mx-(mx-G.cameraX)*(G.zoom/oldZ);G.cameraY=my-(my-G.cameraY)*(G.zoom/oldZ);},{passive:false});

// Tooltip
C.addEventListener('mousemove',e=>{
  let rect=C.getBoundingClientRect(),{col,row}=fromScreen(e.clientX-rect.left,e.clientY-rect.top),tip=document.getElementById('tooltip');
  if(col>=0&&row>=0&&col<COLS&&row<ROWS){let tile=G.grid[row][col];if(tile.building){let b=G.buildings.find(b2=>b2.id===tile.building);
    if(b){let def=BLDG[b.type],html='<b>'+def.icon+' '+def.name+'</b><br>';
      if(def.excitement)html+='Excitement: '+def.excitement+' · Intensity: '+def.intensity+'<br>';
      if(b.queue)html+='Queue: '+b.queue.length+'/'+def.capacity+'<br>';
      html+='Revenue: $'+Math.round(b.income||0)+'<br>Upkeep: $'+def.upkeep+'/mo';
      tip.innerHTML=html;tip.style.display='block';tip.style.left=(e.clientX-rect.left+15)+'px';tip.style.top=(e.clientY-rect.top+15)+'px';return;}}}
  tip.style.display='none';
});

// Save/Load
function saveGame(){
  let save={money:G.money,month:G.month,day:G.day,parkRating:G.parkRating,parkValue:G.parkValue,totalGuests:G.totalGuests,research:G.research,
    loan:G.loan,weather:G.weather,guestId:G.guestId,
    buildings:G.buildings.map(b=>({type:b.type,col:b.col,row:b.row,income:b.income||0})),
    grid:G.grid.map(row=>row.map(t=>({terrain:t.terrain,pathType:t.pathType||null})))};
  localStorage.setItem('parkTycoonSave',JSON.stringify(save));showMsg('Game saved!');
}
function loadSave(){
  let s=localStorage.getItem('parkTycoonSave');if(!s)return false;
  try{let save=JSON.parse(s);G.money=save.money;G.month=save.month;G.day=save.day;G.parkRating=save.parkRating;G.parkValue=save.parkValue;
    G.totalGuests=save.totalGuests;G.research=save.research||{};G.loan=save.loan||0;G.weather=save.weather||'sunny';G.guestId=save.guestId||0;
    G.grid=[];for(let r=0;r<ROWS;r++){G.grid[r]=[];for(let c=0;c<COLS;c++)G.grid[r][c]={terrain:save.grid[r][c].terrain,pathType:save.grid[r][c].pathType,building:null};}
    G.buildings=[];for(let bs of save.buildings){let def=BLDG[bs.type],b={type:bs.type,col:bs.col,row:bs.row,id:Date.now()+Math.random(),queue:[],rideTimer:0,income:bs.income||0};
      G.buildings.push(b);for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++)G.grid[b.row+dr][b.col+dc].building=b.id;}
    G.guests=[];showMsg('Game loaded!');return true;}catch(e){return false;}
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){G.tool=null;G.demolish=false;renderTab();}if(e.key===' '||e.key==='p'){G.speed=G.speed===0?1:0;updateSpeedDisplay();}if(e.key==='s'&&e.ctrlKey){e.preventDefault();saveGame();}});

function init(){
  resize();initGrid();
  let ep=toIso(G.entrance.col,G.entrance.row);G.cameraX=-ep.x*G.zoom;G.cameraY=-ep.y*G.zoom+C.height*0.3;
  renderTab();updateStats();
  if(!loadSave())showMsg('Welcome to Park Tycoon! Start by laying paths from the entrance, then build rides beside them.');
}

let lastTime=performance.now();
function gameLoop(now){
  let dt=Math.min(0.1,(now-lastTime)/1000);lastTime=now;
  update(dt);draw();
  if(Math.floor(now/500)!==Math.floor((now-dt*1000)/500)){updateStats();if(currentTab==='guests'||currentTab==='finance')renderTab();}
  requestAnimationFrame(gameLoop);
}

init();requestAnimationFrame(gameLoop);
</script>
</body>
</html>
