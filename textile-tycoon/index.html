.r-btn:hover{background:#1e3040}.r-btn:disabled{opacity:.4;cursor:not-allowed}
.info-panel{background:#0f1820;border:1px solid #1a2634;border-radius:6px;padding:8px;margin-bottom:5px;font-size:12px;line-height:1.7}

.bar-row{display:flex;align-items:center;gap:4px;font-size:10px;margin:2px 0}

.bar-bg{flex:1;height:6px;background:#0a1018;border-radius:3px}.bar-fill{height:100%;border-radius:3px;transition:width .3s}

#main{flex:1;position:relative;background:#1a2218}
canvas{display:block}

.hud-btn:hover{background:#1a2838dd}.hud-btn.active{border-color:#f2b134;color:#f2b134}

<script>
// =====================================================
// TEXTILE TYCOON — Processing, Dyeing & Printing
// Machines based on real textile factory layouts
// =====================================================
const C=document.getElementById('game'),ctx=C.getContext('2d');
const COLS=52,ROWS=52,ISO_W=44,ISO_H=22,HW=ISO_W/2,HH=ISO_H/2;

// ---- GAME STATE ----
let G={

  reputation:50,totalRevenue:0,research:{},tool:null,demolish:false,
  cameraX:0,cameraY:0,zoom:0.8,dragStart:null,dragCam:null,hover:null,
  msgTimer:0,buildId:0,
  // Inventory
  inv:{greige:30,scoured:0,bleached:0,mercerized:0,dyed:0,printed:0,finished:0,
       dye_paste:0,print_paste:0,screens:0},
  orders:[],nextOrderId:1,
  // Market prices fluctuate
  greige_price:50,finished_price:0,
  loan:0,maxLoan:80000,
  weather:'normal',
};

const TERRAIN={FLOOR:0,PATH:1,WALL:2,WATER:3};

// ---- DEPARTMENT ZONES (cosmetic) ----
const ZONES=[
  {name:'Preparatory',color:'#2a3a2e',x:0,y:0,w:18,h:16},
  {name:'Dyeing Hall',color:'#1e2e3a',x:0,y:16,w:18,h:18},
  {name:'Colour Kitchen',color:'#2e2a3a',x:18,y:16,w:16,h:18},
  {name:'Printing Dept',color:'#3a2e2a',x:18,y:0,w:18,h:16},
  {name:'Screen Engraving',color:'#2a2e3a',x:36,y:0,w:16,h:16},
  {name:'Finishing',color:'#2e3a2e',x:36,y:16,w:16,h:18},
  {name:'Warehouse',color:'#3a3a2e',x:0,y:34,w:52,h:18},
];

// ---- MACHINE DEFINITIONS (based on real textile factory equipment) ----
const MACH={
  // === PREPARATORY ===
  singeing:{name:'Singeing Machine',cat:'prep',cost:3000,upkeep:25,icon:'🔥',color:'#c05020',w:3,h:1,
    input:'greige',output:'scoured',time:8,desc:'Burns off protruding fibres for smooth fabric surface',unlocked:true},
  desizing:{name:'Desizing & Scouring',cat:'prep',cost:4000,upkeep:35,icon:'🧪',color:'#4a8a6a',w:3,h:2,
    input:'greige',output:'scoured',time:10,desc:'Removes sizing agents and natural impurities from greige fabric',unlocked:true},
  bleaching:{name:'Bleaching Range',cat:'prep',cost:5500,upkeep:40,icon:'⚪',color:'#a0b0c0',w:4,h:2,
    input:'scoured',output:'bleached',time:12,desc:'Continuous bleaching with H₂O₂ for uniform whiteness',research:'bleach_range'},
  mercerizer:{name:'Mercerizing Machine',cat:'prep',cost:8000,upkeep:55,icon:'✨',color:'#7090b0',w:4,h:2,
    input:'bleached',output:'mercerized',time:14,desc:'NaOH treatment for lustre, strength and dye uptake. Premium fabric path.',research:'mercerizer'},

  // === DYEING ===
  dispensing:{name:'Dispensing Station',cat:'dye',cost:3500,upkeep:20,icon:'⚖️',color:'#3f7d3f',w:2,h:2,
    input:null,output:'dye_paste',time:6,desc:'Green-frame weighing table with moving gantry crane — weighs and dispenses dye chemicals',unlocked:true,generator:true},
  jet_dye:{name:'HT Jet Dyeing Machine',cat:'dye',cost:12000,upkeep:80,icon:'🌀',color:'#2162ae',w:3,h:3,
    input:'bleached',output:'dyed',time:16,needs:'dye_paste',desc:'High-temperature jet dyeing vessel with dosing cabinet — dyes fabric in rope form at 130°C',unlocked:true},
  jigger:{name:'Jigger Dyeing',cat:'dye',cost:6000,upkeep:45,icon:'🔄',color:'#5a7aaa',w:2,h:2,
    input:'bleached',output:'dyed',time:14,needs:'dye_paste',desc:'Open-width dyeing on a jigger for flat fabrics',research:'jigger'},
  padder:{name:'Pad-Dry-Cure',cat:'dye',cost:15000,upkeep:90,icon:'📐',color:'#4a6a8a',w:4,h:2,
    input:'bleached',output:'dyed',time:10,needs:'dye_paste',desc:'Continuous padding, drying and curing line — high throughput',research:'pad_dry'},

  // === COLOUR KITCHEN ===
  colour_mixer:{name:'Colour Kitchen Mixer',cat:'kitchen',cost:5000,upkeep:30,icon:'🎨',color:'#9b6cc9',w:2,h:2,
    input:null,output:'print_paste',time:8,desc:'SS tanks with stirrers — mixes print paste from pigments and binders',unlocked:true,generator:true},
  auto_dispenser:{name:'Auto Colour Dispenser',cat:'kitchen',cost:12000,upkeep:50,icon:'🤖',color:'#7a5ab0',w:3,h:2,
    input:null,output:'print_paste',time:4,desc:'Computer-controlled dispensing with stored recipes. Double output speed.',research:'auto_dispenser',generator:true},

  // === PRINTING ===
  rotary_baby:{name:'Baby Rotary (Sampling)',cat:'print',cost:8000,upkeep:50,icon:'🖨️',color:'#b23a8a',w:4,h:2,
    input:'bleached',output:'printed',time:14,needs:'print_paste',needs_screen:true,desc:'4-head sampling rotary line for design proofs and short runs',unlocked:true},
  rotary_prod:{name:'Rotary Print Line',cat:'print',cost:20000,upkeep:100,icon:'🖨️',color:'#d94070',w:5,h:3,
    input:'bleached',output:'printed',time:10,needs:'print_paste',needs_screen:true,desc:'8-head production rotary with dryer — blanket, spinning screens, squeegees, hot-air dryer and plaiter',research:'rotary_prod'},
  flatbed:{name:'Flatbed Screen Printer',cat:'print',cost:25000,upkeep:110,icon:'📋',color:'#1f5fc4',w:5,h:3,
    input:'bleached',output:'printed',time:12,needs:'print_paste',needs_screen:true,desc:'Stop-and-go flatbed with hydraulic screen lift, squeegee carriages, blanket wash and panelled dryer',research:'flatbed'},
  digital:{name:'Digital Inkjet Printer',cat:'print',cost:35000,upkeep:80,icon:'💻',color:'#2d3b4e',w:3,h:2,
    input:'bleached',output:'printed',time:6,desc:'High-speed digital printer — no screens needed, unlimited colours, low paste usage',research:'digital'},

  // === SCREEN ENGRAVING ===
  coater:{name:'Screen Coating Machine',cat:'engrave',cost:4000,upkeep:20,icon:'🖌️',color:'#3c78b8',w:2,h:1,
    input:null,output:'screens',time:10,desc:'Auto coating of rotary screens with photosensitive emulsion',unlocked:true,generator:true},
  laser_engraver:{name:'Laser Engraver',cat:'engrave',cost:15000,upkeep:60,icon:'⚡',color:'#d23a44',w:3,h:1,
    input:null,output:'screens',time:6,desc:'Laser exposure of coated screens from digital design files — precision and speed',research:'laser_eng',generator:true},
  developer:{name:'Screen Developer',cat:'engrave',cost:3000,upkeep:15,icon:'🚿',color:'#5090c0',w:2,h:1,
    input:null,output:'screens',time:8,desc:'Develops exposed screens by washing away unexposed emulsion',unlocked:true,generator:true},

  // === FINISHING ===
  stenter:{name:'Stenter Frame',cat:'finish',cost:18000,upkeep:85,icon:'📏',color:'#c9ced4',w:5,h:2,
    input:'dyed',output:'finished',time:12,desc:'6-chamber stenter with pin/clip chains — heat-sets, dries and width-controls fabric',research:'stenter'},
  stenter_print:{name:'Stenter (Print Finish)',cat:'finish',cost:18000,upkeep:85,icon:'📏',color:'#aab4be',w:5,h:2,
    input:'printed',output:'finished',time:12,desc:'Finishing stenter for printed goods — curing and setting the print',research:'stenter'},
  calender:{name:'Calender',cat:'finish',cost:8000,upkeep:40,icon:'🔧',color:'#8a9aaa',w:2,h:2,
    input:'dyed',output:'finished',time:10,desc:'Heavy roller machine for smooth or glazed finish',unlocked:true},
  sanforizer:{name:'Sanforizer',cat:'finish',cost:12000,upkeep:55,icon:'📐',color:'#6a8a7a',w:4,h:2,
    input:'finished',output:'finished',time:8,desc:'Pre-shrinking treatment for dimensional stability. Upgrades existing finished fabric.',research:'sanforizer',upgrader:true},

  // === INFRASTRUCTURE ===
  boiler:{name:'Steam Boiler',cat:'infra',cost:10000,upkeep:60,icon:'♨️',color:'#8a6050',w:3,h:3,
    desc:'Supplies steam to dyeing, printing and finishing machines. Boosts all machine speed by 15%.',unlocked:true,utility:true},
  etp:{name:'Effluent Treatment Plant',cat:'infra',cost:15000,upkeep:70,icon:'♻️',color:'#3a8a5a',w:4,h:3,
    desc:'Treats wastewater. Required for reputation above 70 and unlocks export orders.',research:'etp',utility:true},
  lab:{name:'Quality Lab',cat:'infra',cost:6000,upkeep:25,icon:'🔬',color:'#6a7a8a',w:2,h:2,
    desc:'Tests colour fastness, shrinkage, GSM. Reduces rejection rate and boosts reputation.',unlocked:true,utility:true},
  trolley_store:{name:'Trolley Storage Bay',cat:'infra',cost:2000,upkeep:5,icon:'🛒',color:'#8b6914',w:3,h:2,
    desc:'A-frame batching trolleys for WIP buffer between departments. +10% throughput.',unlocked:true,utility:true},

  // === PATHS ===
  path:{name:'Factory Aisle',cat:'path',cost:20,upkeep:0,icon:'🛤️',w:1,h:1,color:'#706858',unlocked:true,isPath:true},
};

// ---- RESEARCH TREE ----
const RESEARCH=[
  {id:'bleach_range',name:'Continuous Bleaching',desc:'Unlock bleaching range for uniform whiteness',cost:3000,icon:'⚪'},
  {id:'mercerizer',name:'Mercerizing',desc:'Unlock mercerizer for premium lustre fabric',cost:6000,icon:'✨',requires:'bleach_range'},
  {id:'jigger',name:'Jigger Dyeing',desc:'Unlock open-width jigger dyeing',cost:3000,icon:'🔄'},
  {id:'pad_dry',name:'Pad-Dry-Cure',desc:'Unlock continuous padding line — fastest dyeing',cost:8000,icon:'📐',requires:'jigger'},
  {id:'auto_dispenser',name:'Auto Dispensing',desc:'Computer-controlled colour dispensing — double speed',cost:7000,icon:'🤖'},
  {id:'rotary_prod',name:'Production Rotary',desc:'Unlock 8-head production rotary print line',cost:10000,icon:'🖨️'},
  {id:'flatbed',name:'Flatbed Printing',desc:'Unlock flatbed screen printer with dryer',cost:15000,icon:'📋',requires:'rotary_prod'},
  {id:'digital',name:'Digital Printing',desc:'Unlock inkjet digital printer — no screens needed',cost:25000,icon:'💻',requires:'flatbed'},
  {id:'laser_eng',name:'Laser Engraving',desc:'Precision laser screen exposure from digital files',cost:8000,icon:'⚡'},
  {id:'stenter',name:'Stenter Frame',desc:'Unlock finishing stenter for heat-setting and width control',cost:10000,icon:'📏'},
  {id:'sanforizer',name:'Sanforizing',desc:'Pre-shrinking for export-grade dimensional stability',cost:8000,icon:'📐',requires:'stenter'},
  {id:'etp',name:'Effluent Treatment',desc:'Unlock ETP — required for reputation >70 and export orders',cost:12000,icon:'♻️'},
  {id:'marketing1',name:'Domestic Marketing',desc:'+25% order frequency',cost:5000,icon:'📰'},
  {id:'marketing2',name:'Export Marketing',desc:'Unlock export orders (higher value)',cost:12000,icon:'🌍',requires:'marketing1'},
];

// ---- MATERIAL NAMES ----
const MAT_NAMES={
  greige:'Greige Fabric',scoured:'Scoured Fabric',bleached:'Bleached Fabric',
  mercerized:'Mercerized Fabric',dyed:'Dyed Fabric',printed:'Printed Fabric',
  finished:'Finished Fabric',dye_paste:'Dye Paste',print_paste:'Print Paste',screens:'Screens'
};

// ---- INIT ----
function initGrid(){
  G.grid=[];
  for(let r=0;r<ROWS;r++){G.grid[r]=[];for(let c=0;c<COLS;c++) G.grid[r][c]={terrain:TERRAIN.FLOOR,building:null};}
  // Entrance aisle
  for(let r=48;r<ROWS;r++){G.grid[r][26].terrain=TERRAIN.PATH;G.grid[r][25].terrain=TERRAIN.PATH;}
  // Main horizontal aisle
  for(let c=2;c<50;c++){G.grid[34][c].terrain=TERRAIN.PATH;G.grid[35][c].terrain=TERRAIN.PATH;}
  // Vertical aisles
  for(let r=2;r<48;r++){G.grid[r][17].terrain=TERRAIN.PATH;G.grid[r][35].terrain=TERRAIN.PATH;}
}

// ---- ISO HELPERS ----
function toIso(c,r){return{x:(c-r)*HW,y:(c+r)*HH};}
function toScreen(c,r){let i=toIso(c,r);return{x:i.x*G.zoom+G.cameraX+C.width/2,y:i.y*G.zoom+G.cameraY+C.height/2};}
function fromScreen(sx,sy){let x=(sx-C.width/2-G.cameraX)/G.zoom,y=(sy-C.height/2-G.cameraY)/G.zoom;return{col:Math.floor((x/HW+y/HH)/2),row:Math.floor((y/HH-x/HW)/2)};}
function resize(){C.width=C.parentElement.clientWidth;C.height=C.parentElement.clientHeight;}
window.addEventListener('resize',resize);

function darken(hex,a){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return'#'+((1<<24)+(Math.floor(r*(1-a))<<16)+(Math.floor(g*(1-a))<<8)+Math.floor(b*(1-a))).toString(16).slice(1);}

function drawTile(col,row,color,h){
  let p=toScreen(col,row),ht=(h||0)*G.zoom,w=HW*G.zoom,hh=HH*G.zoom;
  ctx.beginPath();ctx.moveTo(p.x,p.y-ht);ctx.lineTo(p.x+w,p.y+hh-ht);ctx.lineTo(p.x,p.y+2*hh-ht);ctx.lineTo(p.x-w,p.y+hh-ht);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=0.5;ctx.stroke();
  if(ht>0){
    ctx.beginPath();ctx.moveTo(p.x-w,p.y+hh-ht);ctx.lineTo(p.x-w,p.y+hh);ctx.lineTo(p.x,p.y+2*hh);ctx.lineTo(p.x,p.y+2*hh-ht);ctx.closePath();ctx.fillStyle=darken(color,.25);ctx.fill();
    ctx.beginPath();ctx.moveTo(p.x,p.y+2*hh-ht);ctx.lineTo(p.x,p.y+2*hh);ctx.lineTo(p.x+w,p.y+hh);ctx.lineTo(p.x+w,p.y+hh-ht);ctx.closePath();ctx.fillStyle=darken(color,.15);ctx.fill();
  }
}

function getFloorColor(c,r){
  // Zone-based coloring
  for(let z of ZONES){if(c>=z.x&&c<z.x+z.w&&r>=z.y&&r<z.y+z.h)return z.color;}
  let v=((c*7+r*13)%4)*2;return`rgb(${38+v},${48+v},${36+v})`;
}

// ---- DRAWING ----
function drawBuilding(b){
  let def=MACH[b.type];if(!def)return;
  for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++){
    let ht=def.utility?10:def.isPath?1:7;
    drawTile(b.col+dc,b.row+dr,def.color,ht);
  }
  let cx=b.col+def.w/2,cy=b.row+def.h/2,p=toScreen(cx,cy);
  let ht=def.utility?10:def.isPath?1:7;
  let sz=Math.max(12,18*G.zoom);
  ctx.font=sz+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(def.icon,p.x,p.y-ht*G.zoom-2);
  // Progress bar
  if(b.progress>0&&def.time&&!def.utility&&!def.isPath){
    let bw=def.w*HW*G.zoom*1.2,bh=4*G.zoom;
    let bx=p.x-bw/2,by=p.y-ht*G.zoom-sz/2-6*G.zoom;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=b.hasWorker?'#4ade80':'#f2b134';
    ctx.fillRect(bx,by,bw*(b.progress/def.time),bh);
  }
  // Worker indicator
  if(!def.isPath&&!def.utility&&G.zoom>0.5){
    ctx.font='bold '+Math.max(7,9*G.zoom)+'px sans-serif';
    ctx.fillStyle=b.hasWorker?'#4ade80':'#ff6b6b';
    ctx.fillText(b.hasWorker?'👷':'⚠️ NO WORKER',p.x,p.y+HH*G.zoom*def.h*0.3);
  }
}

function drawHover(){
  if(!G.hover)return;let{col,row}=G.hover;if(col<0||row<0||col>=COLS||row>=ROWS)return;
  if(G.tool){let def=MACH[G.tool];if(def){let can=canPlace(G.tool,col,row);
    for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++){
      let p=toScreen(col+dc,row+dr),w=HW*G.zoom,hh=HH*G.zoom;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+w,p.y+hh);ctx.lineTo(p.x,p.y+2*hh);ctx.lineTo(p.x-w,p.y+hh);ctx.closePath();
      ctx.fillStyle=can?'rgba(74,222,128,0.3)':'rgba(255,80,80,0.3)';ctx.fill();ctx.strokeStyle=can?'#4ade80':'#ff5050';ctx.lineWidth=1.5;ctx.stroke();
    }
  }}else if(G.demolish){
    let p=toScreen(col,row),w=HW*G.zoom,hh=HH*G.zoom;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+w,p.y+hh);ctx.lineTo(p.x,p.y+2*hh);ctx.lineTo(p.x-w,p.y+hh);ctx.closePath();
    ctx.fillStyle='rgba(255,80,80,0.3)';ctx.fill();
  }
}

function draw(){
  ctx.fillStyle='#1a2218';ctx.fillRect(0,0,C.width,C.height);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    let t=G.grid[r][c];
    if(t.terrain===TERRAIN.PATH) drawTile(c,r,'#706858',1);
    else drawTile(c,r,getFloorColor(c,r),0);
  }
  // Zone labels
  if(G.zoom>0.4){for(let z of ZONES){
    let p=toScreen(z.x+z.w/2,z.y+1);
    ctx.font='bold '+Math.max(8,11*G.zoom)+'px sans-serif';ctx.textAlign='center';
    ctx.fillStyle='rgba(242,177,52,0.5)';ctx.fillText(z.name,p.x,p.y);
  }}
  // Buildings sorted by depth
  let sorted=[...G.buildings].sort((a,b)=>(a.col+a.row)-(b.col+b.row));
  sorted.forEach(b=>drawBuilding(b));
  // Entrance
  let ep=toScreen(25.5,49);
  drawTile(25,49,'#f2b134',5);drawTile(26,49,'#f2b134',5);
  ctx.font='bold '+Math.max(9,12*G.zoom)+'px sans-serif';ctx.textAlign='center';ctx.fillStyle='#1a1a2e';
  ctx.fillText('GATE',ep.x,ep.y-5*G.zoom);
  drawHover();
}

// ---- BUILDING ----
function isPath(c,r){return c>=0&&r>=0&&c<COLS&&r<ROWS&&G.grid[r][c].terrain===TERRAIN.PATH;}

function adjacentPath(col,row,w,h){
  for(let dc=0;dc<w;dc++){if(row>0&&isPath(col+dc,row-1))return true;if(row+h<ROWS&&isPath(col+dc,row+h))return true;}
  for(let dr=0;dr<h;dr++){if(col>0&&isPath(col-1,row+dr))return true;if(col+w<COLS&&isPath(col+w,row+dr))return true;}
  return false;
}

function canPlace(type,col,row){
  let def=MACH[type];if(!def)return false;
  for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++){
    let c2=col+dc,r2=row+dr;if(c2<0||r2<0||c2>=COLS||r2>=ROWS)return false;
    let t=G.grid[r2][c2];
    if(def.isPath){if(t.building)return false;}
    else{if(t.terrain===TERRAIN.PATH||t.building)return false;}
  }
  if(!def.isPath)if(!adjacentPath(col,row,def.w,def.h))return false;
  return true;
}

function placeBuild(type,col,row){
  let def=MACH[type];if(!def)return;
  if(G.money<def.cost){showMsg('Not enough money!');return;}
  if(!canPlace(type,col,row)){showMsg('Cannot build there — needs adjacent aisle');return;}
  G.money-=def.cost;
  let b={type,col,row,id:G.buildId++,progress:0,income:0,hasWorker:false,level:1,produced:0,broken:false};
  for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++){
    let t=G.grid[row+dr][col+dc];
    if(def.isPath){t.terrain=TERRAIN.PATH;}else{t.building=b.id;}
  }
  if(!def.isPath)G.buildings.push(b);
  showMsg(def.name+' built for $'+def.cost.toLocaleString());
}

function demolishAt(col,row){
  if(col<0||row<0||col>=COLS||row>=ROWS)return;
  let t=G.grid[row][col];
  if(t.building){
    let b=G.buildings.find(x=>x.id===t.building);if(!b)return;
    let def=MACH[b.type],refund=Math.floor(def.cost*0.25);G.money+=refund;
    for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++)G.grid[b.row+dr][b.col+dc].building=null;
    G.buildings=G.buildings.filter(x=>x.id!==b.id);
    showMsg(def.name+' demolished. $'+refund+' refunded.');
  }else if(t.terrain===TERRAIN.PATH){t.terrain=TERRAIN.FLOOR;G.money+=5;}
}

// ---- SIMULATION ----
function assignWorkers(){
  let avail=G.workers;
  // Prioritize by: utility first, then production machines
  let sorted=[...G.buildings].sort((a,b)=>{
    let da=MACH[a.type],db=MACH[b.type];
    let pa=da.utility?0:da.generator?1:2,pb=db.utility?0:db.generator?1:2;
    return pa-pb;
  });
  for(let b of G.buildings)b.hasWorker=false;
  for(let b of sorted){
    let def=MACH[b.type];if(def.isPath)continue;
    if(avail>0){b.hasWorker=true;avail--;}
  }
}

function hasUtility(type){return G.buildings.some(b=>b.type===type&&b.hasWorker);}

function updateMachines(dt){
  assignWorkers();
  let boilerBonus=hasUtility('boiler')?0.15:0;
  let labBonus=hasUtility('lab');
  let trolleyBonus=hasUtility('trolley_store')?0.10:0;

  for(let b of G.buildings){
    let def=MACH[b.type];
    if(!def||def.isPath||def.utility||b.broken||!b.hasWorker)continue;

    // Check input availability
    if(def.generator){
      // Generators (dispensing, colour mixer, coater, etc) produce from nothing
    }else{
      if(!def.input||G.inv[def.input]<=0)continue;
      if(def.needs&&G.inv[def.needs]<=0)continue;
      if(def.needs_screen&&G.inv.screens<=0)continue;
    }

    let speed=(1+boilerBonus+trolleyBonus)*(1+0.2*(b.level-1));
    b.progress+=dt*speed;

    if(b.progress>=def.time){
      b.progress=0;
      // Consume inputs
      if(!def.generator){
        if(def.input)G.inv[def.input]--;
        if(def.needs)G.inv[def.needs]--;
        if(def.needs_screen)G.inv.screens=Math.max(0,G.inv.screens-0.1); // screens last ~10 uses
      }
      // Produce output
      if(def.output){
        G.inv[def.output]++;
        b.produced++;
      }
    }
  }
}

function updateEconomy(dt){
  G.day+=dt*0.05;
  if(G.day<30)return;
  G.day=0;G.month++;

  // Upkeep
  let upkeep=0;
  for(let b of G.buildings){let d=MACH[b.type];if(d)upkeep+=d.upkeep;}
  // Wages
  let wages=G.workers*200;
  // Loan interest
  let interest=Math.floor(G.loan*0.04/12);
  let total=upkeep+wages+interest;
  G.money-=total;

  // Greige price fluctuation
  G.greige_price=Math.max(30,Math.min(80,G.greige_price+(Math.random()*10-5)));

  // Random breakdowns
  for(let b of G.buildings){
    let def=MACH[b.type];
    if(def&&!def.utility&&!def.isPath&&!b.broken&&Math.random()<0.02){
      b.broken=true;showMsg(def.name+' broke down! Click it to repair.');
    }
  }

  // New orders
  if(G.orders.length<6&&Math.random()<(G.research.marketing1?0.7:0.5)){
    generateOrder();
  }

  // Expire orders
  G.orders=G.orders.filter(o=>{
    if(o.deadline<G.month){G.reputation=Math.max(0,G.reputation-5);showMsg('Order #'+o.id+' expired!');return false;}
    return true;
  });

  // Reputation
  let hasEtp=hasUtility('etp');
  let hasLab=hasUtility('lab');
  if(hasLab)G.reputation=Math.min(100,G.reputation+1);
  if(!hasEtp&&G.reputation>70)G.reputation=70;

  if(G.money<0)showMsg('⚠️ Negative cash! Fulfill orders or sell fabric.');
}

function generateOrder(){
  let types=['dyed','printed','finished'];
  let type=types[Math.floor(Math.random()*types.length)];
  let isExport=G.research.marketing2&&Math.random()<0.3;
  if(isExport&&!hasUtility('etp'))isExport=false;
  let qty=5+Math.floor(Math.random()*20);
  let basePrice=type==='finished'?120:type==='printed'?90:60;
  if(isExport)basePrice*=1.5;
  let reward=Math.round(qty*basePrice*(0.9+Math.random()*0.3));
  G.orders.push({
    id:G.nextOrderId++,type,qty,reward,
    deadline:G.month+3+Math.floor(Math.random()*3),
    isExport,
    label:(isExport?'🌍 Export: ':'📦 ')+ qty+' '+MAT_NAMES[type]
  });
}

function fulfillOrder(id){
  let o=G.orders.find(x=>x.id===id);if(!o)return;
  if(G.inv[o.type]<o.qty){showMsg('Not enough '+MAT_NAMES[o.type]+'!');return;}
  G.inv[o.type]-=o.qty;G.money+=o.reward;G.totalRevenue+=o.reward;
  G.reputation=Math.min(100,G.reputation+(o.isExport?5:3));
  G.orders=G.orders.filter(x=>x.id!==id);
  showMsg('Order #'+o.id+' delivered! Earned $'+o.reward.toLocaleString());
}

// ---- UPDATE ----
function update(dt){
  if(G.speed===0)return;
  let gdt=dt*G.speed*3;G.tick+=gdt;
  updateMachines(gdt);updateEconomy(gdt);
  if(G.msgTimer>0){G.msgTimer-=dt;if(G.msgTimer<=0)document.getElementById('msg').classList.remove('show');}
}

function renderOrdersTab(){
  if(!G.orders.length) return '<div style="padding:12px;color:#5a7a94;font-size:12px">No active orders. Keep producing fabric — orders arrive each month.</div>';

  for(let o of G.orders){

    html+='<div style="font-size:11px">You have: <b style="color:'+(canFulfill?'#4ade80':'#ff6b6b')+'">'+Math.round(G.inv[o.type])+'/'+o.qty+'</b></div>';

function renderResearchTab(){
  let html='';
  for(let r of RESEARCH){

    html+='<div class="r-item'+(done?' done':'')+'">';

    }
    html+='</div>';
  }
  return html;

function renderFinanceTab(){

  let wages=G.workers*200;
  let machCount={};G.buildings.forEach(b=>{let d=MACH[b.type];if(d&&!d.isPath){machCount[d.cat]=(machCount[d.cat]||0)+1;}});

  html+='Greige Price: <b>$'+Math.round(G.greige_price)+'/bale</b><br>';
  html+='Reputation: <b style="color:#f2b134">'+G.reputation+'/100</b><br>';
  html+='Loan: <b>$'+G.loan.toLocaleString()+'</b> / $'+G.maxLoan.toLocaleString()+'<br>';
  html+='<hr style="border-color:#1e2a38;margin:6px 0">';
  html+='<b>Machines by Department:</b><br>';
  for(let cat of ['prep','dye','kitchen','print','engrave','finish','infra']){
    let names={prep:'Preparatory',dye:'Dyeing',kitchen:'Colour Kitchen',print:'Printing',engrave:'Screen Engr.',finish:'Finishing',infra:'Infrastructure'};

let currentTab='build';

  let el=document.getElementById('tab-content');
  switch(currentTab){
    case'build':el.innerHTML=renderBuildTab();bindBuild();break;
    case'orders':el.innerHTML=renderOrdersTab();bindOrders();break;
    case'research':el.innerHTML=renderResearchTab();bindResearch();break;
    case'finance':el.innerHTML=renderFinanceTab();bindFinance();break;
  }
}

function bindBuild(){document.querySelectorAll('.item-btn').forEach(btn=>{btn.addEventListener('click',()=>{
  G.demolish=false;document.getElementById('btn-demolish').classList.remove('active');
  G.tool=G.tool===btn.dataset.type?null:btn.dataset.type;renderTab();});});}

function bindOrders(){document.querySelectorAll('.fulfill-btn').forEach(btn=>{btn.addEventListener('click',()=>{
  fulfillOrder(+btn.dataset.oid);renderTab();updateStats();});});}

function bindResearch(){document.querySelectorAll('.r-btn[data-rid]').forEach(btn=>{btn.addEventListener('click',()=>{
  let rid=btn.dataset.rid,r=RESEARCH.find(x=>x.id===rid);
  if(r&&G.money>=r.cost&&!G.research[rid]){G.money-=r.cost;G.research[rid]=true;showMsg(r.name+' researched!');renderTab();updateStats();}});});}

function bindFinance(){

    if(t.building){let b=G.buildings.find(x=>x.id===t.building);if(b){let def=MACH[b.type];
      let html='<b>'+def.icon+' '+def.name+'</b>';
      if(b.broken)html+=' <span style="color:#ff6b6b">[BROKEN — click to repair]</span>';
      html+='<br>'+def.desc;
      if(def.input)html+='<br>In: '+MAT_NAMES[def.input]+(def.needs?' + '+MAT_NAMES[def.needs]:'')+(def.needs_screen?' + Screen':'')+' → '+MAT_NAMES[def.output];
      if(def.generator&&def.output)html+='<br>Produces: '+MAT_NAMES[def.output];
      html+='<br>Produced: '+b.produced+' · Upkeep: $'+def.upkeep+'/mo';
      html+='<br>Worker: '+(b.hasWorker?'✅ Assigned':'❌ None');
      tip.innerHTML=html;tip.style.display='block';tip.style.left=(e.clientX-rect.left+15)+'px';tip.style.top=(e.clientY-rect.top+15)+'px';return;}}}
  tip.style.display='none';
});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){G.tool=null;G.demolish=false;renderTab();}
  if(e.key===' '||e.key==='p'){e.preventDefault();G.speed=G.speed===0?1:0;document.getElementById('btn-pause').textContent=G.speed===0?'▶ Play':'⏸ Pause';updSpd();}
  if(e.key==='s'&&e.ctrlKey){e.preventDefault();saveGame();}
});

// ---- SAVE/LOAD ----
function saveGame(){
  let save={money:G.money,workers:G.workers,month:G.month,day:G.day,reputation:G.reputation,totalRevenue:G.totalRevenue,
    research:G.research,loan:G.loan,inv:G.inv,orders:G.orders,nextOrderId:G.nextOrderId,
    greige_price:G.greige_price,buildId:G.buildId,
    buildings:G.buildings.map(b=>({type:b.type,col:b.col,row:b.row,income:b.income,produced:b.produced,level:b.level,broken:b.broken})),
    grid:G.grid.map(row=>row.map(t=>({terrain:t.terrain})))};
  localStorage.setItem('textileTycoonV2',JSON.stringify(save));showMsg('Game saved!');
}

function loadSave(){
  let s=localStorage.getItem('textileTycoonV2');if(!s)return false;
  try{
    let save=JSON.parse(s);
    Object.assign(G,{money:save.money,workers:save.workers,month:save.month,day:save.day,reputation:save.reputation,
      totalRevenue:save.totalRevenue,research:save.research||{},loan:save.loan||0,inv:save.inv,
      orders:save.orders||[],nextOrderId:save.nextOrderId||1,greige_price:save.greige_price||50,buildId:save.buildId||0});
    G.grid=[];for(let r=0;r<ROWS;r++){G.grid[r]=[];for(let c=0;c<COLS;c++)G.grid[r][c]={terrain:save.grid[r][c].terrain,building:null};}
    G.buildings=[];
    for(let bs of save.buildings){
      let def=MACH[bs.type];if(!def)continue;
      let b={type:bs.type,col:bs.col,row:bs.row,id:G.buildId++,progress:0,income:bs.income||0,
        hasWorker:false,level:bs.level||1,produced:bs.produced||0,broken:bs.broken||false};
      G.buildings.push(b);
      for(let dr=0;dr<def.h;dr++)for(let dc=0;dc<def.w;dc++){
        if(!def.isPath)G.grid[b.row+dr][b.col+dc].building=b.id;
      }
    }
    showMsg('Game loaded!');return true;
  }catch(e){return false;}
}

// ---- INIT & LOOP ----
function init(){
  resize();initGrid();
  let ep=toIso(26,42);G.cameraX=-ep.x*G.zoom;G.cameraY=-ep.y*G.zoom+C.height*0.25;
  renderTab();updateStats();
  if(!loadSave()){
    showMsg('Welcome to Textile Tycoon! Build aisles from the gate, then place processing machines beside them.');
  }
}

let last=performance.now();
function gameLoop(now){
  let dt=Math.min(0.1,(now-last)/1000);last=now;
  update(dt);draw();
  if(Math.floor(now/500)!==Math.floor((now-dt*1000)/500)){updateStats();if(currentTab!=='build')renderTab();
    else{let el=document.querySelector('.info-panel');if(el){
      let html='<b>Inventory</b><br>';
      for(let k of Object.keys(G.inv)){if(G.inv[k]>0||['greige','dyed','printed','finished','dye_paste','print_paste','screens'].includes(k))html+=MAT_NAMES[k]+': <b>'+Math.round(G.inv[k])+'</b> · ';}
      el.innerHTML=html;
    }}
  }
  requestAnimationFrame(gameLoop);
}
init();requestAnimationFrame(gameLoop);
</script>
