<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Textile Tycoon 3D — Processing, Dyeing &amp; Printing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
 --cream:#fff7ea;--cream2:#fdeed6;--cream3:#f6dfbd;--ink:#2a2140;--ink2:#5b5070;--line:#ecd3ad;
 --navy:#16213e;--teal:#14b8a6;--gold:#f6b93b;--gold2:#e58e26;--rose:#ef476f;--leaf:#2ec27e;
 --shadow:0 10px 30px rgba(22,33,62,.28),0 2px 6px rgba(22,33,62,.18);
 --head:"Baloo 2","Trebuchet MS",sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
 --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#cfd8e3;font-family:var(--body);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
#main{position:fixed;inset:0}
#main canvas{display:block;width:100%;height:100%;touch-action:none}
.hidden{display:none!important}
/* loading */
#ld{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
 background:radial-gradient(1200px 700px at 50% 35%,#2b3d75,#141c36 70%);color:#fff;font:700 18px var(--head);letter-spacing:.02em}
#ld .spool{width:86px;height:86px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* plant chip + views */
#chip{position:fixed;top:14px;left:14px;z-index:8;display:flex;align-items:center;gap:10px;background:rgba(22,33,62,.82);backdrop-filter:blur(8px);color:#fff;
 padding:7px 14px 7px 8px;border-radius:999px;box-shadow:var(--shadow);font:700 15px var(--head)}
#chip .logo{width:34px;height:34px}
#chip small{display:block;font:600 11px var(--body);opacity:.75;margin-top:-4px}
#bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(22,33,62,.72);backdrop-filter:blur(8px);box-shadow:var(--shadow);max-width:calc(100vw - 460px);overflow-x:auto;scrollbar-width:none}
#bar button{color:#dfe7ff;font:700 12.5px var(--body);padding:7px 13px;border-radius:999px;white-space:nowrap;transition:background .2s,transform .25s var(--spring)}
#bar button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
#bar button.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1a00;box-shadow:0 3px 10px rgba(229,142,38,.5)}
/* right tools */
#z{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:8;display:flex;flex-direction:column;gap:8px}
#z button{width:46px;height:46px;border-radius:16px;background:rgba(255,247,234,.92);box-shadow:var(--shadow);font:800 17px var(--head);color:var(--ink);transition:transform .25s var(--spring)}
#z button:hover{transform:scale(1.1)}
/* context card */
#info{position:fixed;left:14px;bottom:186px;z-index:7;max-width:min(380px,40vw);background:rgba(255,247,234,.94);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);font-size:13px;line-height:1.45;
 transition:opacity .3s,transform .4s var(--out)}
#info h2{margin:0 0 2px;font:800 16px var(--head)}#info p{margin:0;color:var(--ink2)}#info #st{margin-top:6px;font-weight:800;color:#c2410c;min-height:1em}
#info small{display:none}
#info.quiet{opacity:0;transform:translateY(10px);pointer-events:none}
/* dock */
#dock{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:9;display:flex;gap:8px;padding:10px 14px 8px;border-radius:26px;
 background:linear-gradient(180deg,rgba(255,250,240,.96),rgba(250,232,205,.96));box-shadow:0 18px 40px rgba(22,33,62,.35),inset 0 1px 0 #fff;border:2px solid #fff;animation:dockIn .7s var(--spring)}
@keyframes dockIn{0%{opacity:0;transform:translate(-50%,60px)}100%{opacity:1;transform:translate(-50%,0)}}
.dk{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;padding:4px 2px 2px;border-radius:18px;transition:transform .3s var(--spring),background .2s}
.dk svg{width:56px;height:56px;filter:drop-shadow(0 6px 6px rgba(22,33,62,.25));transition:transform .35s var(--spring)}
.dk span{font:800 11.5px var(--head);color:var(--ink2);letter-spacing:.02em}
.dk:hover{transform:translateY(-6px)}.dk:hover svg{transform:rotate(-6deg) scale(1.08)}
.dk:active svg{transform:scale(.9)}
.dk.on{background:rgba(246,185,59,.28)}.dk.on span{color:#b45309}
.dk .badge{position:absolute;top:0;right:4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--rose);color:#fff;font:800 12px var(--head);display:flex;align-items:center;justify-content:center;
 box-shadow:0 3px 8px rgba(239,71,111,.5);animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
/* status bar */
#status{position:fixed;left:0;right:0;bottom:0;z-index:9;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;
 background:linear-gradient(180deg,#fff7ea,#f4dcb6);border-top:2px solid #fff;box-shadow:0 -6px 20px rgba(22,33,62,.18)}
.sg{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);border:1.5px solid var(--line);border-radius:14px;padding:4px 12px 4px 6px;height:42px}
.sg svg{width:30px;height:30px;flex:none}
.sv{font:800 17px var(--head);min-width:64px;font-variant-numeric:tabular-nums;line-height:1.1}
.sl{font:700 10px var(--body);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
.meter{width:96px;height:12px;border-radius:999px;background:#e9d6b5;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15);margin-top:3px}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#f6b93b,#ffd56b);transition:width .6s var(--out)}
.meter.good i{background:linear-gradient(90deg,#2ec27e,#7ee8a6)}.meter.bad i{background:linear-gradient(90deg,#ef476f,#ff8fa3)}
.spacer{flex:1}
.speed{display:flex;gap:4px;background:rgba(255,255,255,.6);border:1.5px solid var(--line);border-radius:14px;padding:3px}
.speed button{width:38px;height:32px;border-radius:10px;font:800 12px var(--head);color:var(--ink2);transition:transform .2s var(--spring)}
.speed button:hover{transform:scale(1.1)}
.speed button.on{background:linear-gradient(180deg,#5eead4,#14b8a6);color:#053b35;box-shadow:0 3px 8px rgba(20,184,166,.45)}
#sMon{font:800 16px var(--head);min-width:96px;text-align:right}
.up{color:#15803d}.down{color:#be123c}
/* panels */
#panel{position:fixed;left:50%;bottom:168px;z-index:10;width:min(660px,94vw);max-height:calc(100vh - 250px);display:flex;flex-direction:column;
 background:var(--cream);border-radius:28px;border:3px solid #fff;box-shadow:0 24px 60px rgba(22,33,62,.42);transform:translateX(-50%);overflow:hidden;animation:panelIn .45s var(--spring)}
@keyframes panelIn{0%{opacity:0;transform:translate(-50%,40px) scale(.94)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
#panel header{display:flex;align-items:center;gap:12px;padding:12px 16px 10px;background:linear-gradient(180deg,#fff,#fdf1dd);border-bottom:2px solid var(--line)}
#panel header svg{width:44px;height:44px}
#panel header h3{margin:0;font:800 22px var(--head);flex:1}
#panel header .x,.modal header .x{width:36px;height:36px;border-radius:12px;background:#f3dfbf;font:800 18px var(--head);transition:transform .25s var(--spring)}
#panel header .x:hover,.modal header .x:hover{transform:rotate(90deg) scale(1.1)}
#tc{padding:14px 16px 18px;overflow-y:auto}
#tc::-webkit-scrollbar,.modal .mb::-webkit-scrollbar{width:8px}#tc::-webkit-scrollbar-thumb,.modal .mb::-webkit-scrollbar-thumb{background:var(--cream3);border-radius:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chipb{padding:6px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font:800 12px var(--body);color:var(--ink2);transition:transform .2s var(--spring)}
.chipb:hover{transform:translateY(-2px)}.chipb.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.mc{position:relative;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px;transition:transform .3s var(--spring),box-shadow .2s,border-color .2s;animation:rise .45s var(--out) both}
.mc:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 10px 22px rgba(22,33,62,.18);border-color:var(--gold)}
.mc.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(20,184,166,.3)}
.mc img,.mc .ph{width:100%;height:98px;object-fit:contain;border-radius:12px;background:radial-gradient(120px 70px at 50% 60%,#fff,#f1e3cc);display:flex;align-items:center;justify-content:center;font-size:40px}
.mc b{display:block;font:800 13.5px var(--head);line-height:1.15;margin-top:5px}
.mc .cost{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:2px 8px;border-radius:999px;background:#fff3d6;font:800 12px var(--head);color:#9a5b00}
.mc .rec{display:block;font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.3}
.mc .lock{position:absolute;inset:0;border-radius:16px;background:rgba(255,247,234,.8);display:flex;align-items:center;justify-content:center;flex-direction:column;font:800 12px var(--head);color:var(--ink2);text-align:center;padding:10px}
.mc .lock svg{width:34px;height:34px}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;animation:rise .4s var(--out) both}
.card h4{margin:0 0 4px;font:800 15px var(--head)}
.mut{color:var(--ink2);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{padding:9px 16px;border-radius:14px;font:800 14px var(--head);color:#fff;background:linear-gradient(180deg,#6f7dff,#3f46d6);box-shadow:0 4px 0 #2c31a3,0 8px 14px rgba(63,70,214,.3);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2c31a3}
.btn.green{background:linear-gradient(180deg,#3ddc84,#1fa463);box-shadow:0 4px 0 #157a48,0 8px 14px rgba(31,164,99,.3)}
.btn.gold{background:linear-gradient(180deg,#ffd166,#f4a621);color:#3b2400;box-shadow:0 4px 0 #b9760b,0 8px 14px rgba(244,166,33,.3)}
.btn.red{background:linear-gradient(180deg,#ff6b8a,#e23d63);box-shadow:0 4px 0 #a8203f,0 8px 14px rgba(226,61,99,.3)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:11px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;animation:rise .4s var(--out) both}
.kpi b{display:block;font:800 19px var(--head)}.kpi span{font:700 11px var(--body);color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.bar2{height:12px;border-radius:999px;background:#efdfc3;overflow:hidden;margin-top:6px}.bar2 i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#14b8a6,#5eead4);transition:width .6s var(--out)}
.bar2.gold i{background:linear-gradient(90deg,#f4a621,#ffd166)}.bar2.done i{background:linear-gradient(90deg,#2ec27e,#7ee8a6)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.stockrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stk{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 9px;font:700 12px var(--body)}
.stk b{font:800 14px var(--head)}
/* machine editor */
#pe{position:fixed;top:70px;right:72px;z-index:10;width:min(300px,calc(100% - 100px));max-height:calc(100% - 260px);overflow:auto;background:var(--cream);border:3px solid #fff;border-radius:22px;font-size:12.5px;box-shadow:var(--shadow);display:none;animation:peIn .4s var(--spring)}
@keyframes peIn{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:none}}
#pe h3{margin:0;padding:10px 12px;font:800 15px var(--head);display:flex;gap:6px;align-items:center;position:sticky;top:0;background:linear-gradient(180deg,#fff,#fdf1dd);border-bottom:2px solid var(--line)}
#pe h3 input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px dashed var(--line);font:800 15px var(--head);color:var(--ink)}
#pe h3 button{width:30px;height:30px;border-radius:10px;background:#f3dfbf;font-weight:800}
#pe .b{padding:6px 12px 12px}#pe label{display:flex;align-items:center;gap:6px;margin:5px 0}
#pe label span{width:62px;color:var(--ink2);font-weight:700}
#pe input[type=number]{width:0;flex:1;background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 8px;font:inherit}
#pe .sec{color:var(--ink2);margin-top:10px;font:800 11px var(--body);text-transform:uppercase;letter-spacing:.08em}
#pe .dim{color:var(--ink2);margin:3px 0}
#pe .row button{padding:6px 10px;border-radius:11px;background:#fff;border:2px solid var(--line);font:800 12px var(--head)}
#pe .row button:hover{border-color:var(--gold)}
#pe .sw{width:24px!important;height:24px;border-radius:8px!important;padding:0!important;border:2px solid #fff!important;box-shadow:0 1px 3px rgba(0,0,0,.3)}
#pe input[type=color]{width:34px;height:26px;padding:0;border:0;background:none}
#pe .good{color:#15803d}#pe .bad{color:#be123c}
/* toasts + fx */
#toasts{position:fixed;top:70px;left:14px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:360px;background:var(--cream);border:2px solid #fff;border-radius:16px;padding:9px 14px 9px 10px;box-shadow:var(--shadow);font:700 13px var(--body);
 animation:tin .55s var(--spring),tout .45s ease-in 4.2s forwards}
.toast .ti{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(180deg,#ffe29a,#f6b93b);flex:none}
@keyframes tin{0%{opacity:0;transform:translateX(-40px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(-30px)}}
#msg{display:none}
#fxl{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font:800 13px var(--head);color:#fff;padding:3px 10px;border-radius:999px;background:linear-gradient(180deg,rgba(43,61,117,.95),rgba(22,33,62,.95));white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.25);animation:floatUp 1.9s var(--out) forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.08)}100%{opacity:0;transform:translate(-50%,-76px) scale(1)}}
.coin{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffcf3f 40%,#e59400 75%);box-shadow:inset 0 -2px 0 #b06d00,0 2px 6px rgba(0,0,0,.25)}
.bigpop{position:absolute;transform:translate(-50%,-50%);font:800 34px var(--head);color:#15803d;text-shadow:0 3px 0 #fff,0 0 20px rgba(255,255,255,.95);animation:floatUp 2.4s var(--out) forwards}
#banner{position:fixed;top:78px;left:50%;z-index:14;transform:translateX(-50%);pointer-events:none}
#banner div{padding:10px 30px;border-radius:999px;background:linear-gradient(90deg,#16213e,#2b3d75);color:#fff;font:800 20px var(--head);box-shadow:var(--shadow);animation:sweep 2.8s var(--out) forwards;white-space:nowrap}
#banner small{font:700 13px var(--body);opacity:.8;margin-left:10px}
@keyframes sweep{0%{opacity:0;transform:translateX(-120px) skewX(-12deg)}18%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateX(120px)}}
/* modals */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 50% 40%,rgba(43,61,117,.55),rgba(14,20,40,.82));backdrop-filter:blur(3px);animation:fade .4s}
@keyframes fade{from{opacity:0}}
.modal{width:min(1000px,95vw);max-height:92vh;display:flex;flex-direction:column;background:var(--cream);border:4px solid #fff;border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;animation:mIn .6s var(--spring)}
@keyframes mIn{0%{opacity:0;transform:translateY(40px) scale(.9)}100%{opacity:1;transform:none}}
.modal header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:linear-gradient(180deg,#fff,#fdf1dd);border-bottom:2px solid var(--line)}
.modal header svg{width:46px;height:46px}
.modal header h2{margin:0;font:800 26px var(--head);flex:1}
.modal .mb{padding:18px 22px;overflow-y:auto}
.modal footer{display:flex;gap:10px;align-items:center;padding:14px 22px;border-top:2px solid var(--line);background:#fdf1dd}
/* title menu */
#menu{position:fixed;inset:0;z-index:28;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
 background:radial-gradient(900px 600px at 50% 38%,rgba(22,33,62,.1),rgba(10,14,30,.8));animation:fade .8s}
#menu .title{display:flex;flex-direction:column;align-items:center;gap:2px;animation:mIn 1s var(--spring)}
#menu .title svg{width:118px;height:118px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.4));animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(5deg)}}
#menu h1{margin:0;font:800 clamp(44px,7vw,86px)/0.95 var(--head);letter-spacing:.01em;
 background:linear-gradient(180deg,#fff7d6 10%,#ffd166 55%,#f08c00 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 4px 0 #7a3d00) drop-shadow(0 10px 18px rgba(0,0,0,.45))}
#menu .tag{color:#e5ecff;font:800 15px var(--body);letter-spacing:.2em;text-transform:uppercase}
#menu .mbtns{display:flex;flex-direction:column;gap:12px;width:min(350px,86vw)}
.mbtn{display:flex;align-items:center;gap:14px;padding:9px 18px 9px 10px;border-radius:22px;background:linear-gradient(180deg,#fffaf0,#f6dfbd);border:3px solid #fff;box-shadow:0 6px 0 #c99a5b,0 14px 26px rgba(0,0,0,.35);
 font:800 21px var(--head);color:var(--ink);text-align:left;transition:transform .25s var(--spring),box-shadow .2s;animation:rise .6s var(--out) both}
.mbtn svg{width:46px;height:46px;flex:none}
.mbtn:hover{transform:translateY(-4px) scale(1.03)}.mbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #c99a5b}
.mbtn small{display:block;font:700 12px var(--body);color:var(--ink2);margin-top:-4px}
#menu .foot{color:#c9d3f0;font:700 12px var(--body);opacity:.85;text-align:center}
/* wizard */
.steps{display:flex;gap:14px;align-items:center}
.step{display:flex;align-items:center;gap:8px;font:800 13px var(--head);color:var(--ink2)}
.step i{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#efdcbc;font-style:normal;transition:all .3s var(--spring)}
.step.on{color:var(--ink)}.step.on i{background:linear-gradient(180deg,#ffd166,#f4a621);transform:scale(1.18)}
.step.done i{background:var(--leaf);color:#fff}
.scg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sc{position:relative;text-align:left;border-radius:24px;padding:14px;background:#fff;border:3px solid var(--line);transition:transform .3s var(--spring),border-color .2s,box-shadow .2s;animation:rise .45s var(--out) both;min-height:150px}
.sc:hover{transform:translateY(-5px)}.sc.on{border-color:var(--teal);box-shadow:0 0 0 4px rgba(20,184,166,.25)}
.sc svg{width:52px;height:52px}.sc h4{margin:6px 0 2px;font:800 18px var(--head)}.sc p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.sc img{width:100%;height:110px;object-fit:cover;border-radius:16px;background:#e6ebf2}
.stars{position:absolute;top:14px;right:14px;color:#f4a621;font-size:15px;letter-spacing:1px}
.goal{display:inline-block;margin:8px 4px 0 0;padding:3px 9px;border-radius:999px;background:#e9f9f5;color:#0f766e;font:800 11.5px var(--body)}
.drop{border:3px dashed var(--line);border-radius:22px;padding:18px;text-align:center;background:#fffdf8;transition:all .2s;margin-top:14px}
.drop.hot{border-color:var(--teal);background:#effdfa;transform:scale(1.01)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fld{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.fld>label{display:flex;justify-content:space-between;font:800 13px var(--head);margin-bottom:6px}
.fld>label b{color:#0f766e}
.fld input[type=range]{width:100%;accent-color:var(--teal)}
.fld input[type=text]{width:100%;font:800 16px var(--head);border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fffdf8;color:var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 13px var(--body);margin:5px 0}
.tog input{width:44px;height:24px;appearance:none;-webkit-appearance:none;background:#e3cfac;border-radius:999px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .25s var(--spring)}
.tog input:checked{background:var(--teal)}.tog input:checked::after{left:23px}
/* saves */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.slot{background:#fff;border:3px solid var(--line);border-radius:22px;overflow:hidden;animation:rise .4s var(--out) both;transition:transform .3s var(--spring)}
.slot:hover{transform:translateY(-4px)}
.slot img{width:100%;height:120px;object-fit:cover;background:#dfe5ea;display:block}
.slot .si{padding:10px 12px}.slot h4{margin:0;font:800 16px var(--head)}
.foldr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:18px;background:#fff;border:2px solid var(--line);margin-bottom:14px}
.foldr svg{width:40px;height:40px}
#confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
@media (max-width:1000px){.dk{width:54px}.dk svg{width:42px;height:42px}.dk span{font-size:10px}#bar{display:none}.meter{width:60px}.sg .sl{font-size:9px}}
#pe{position:fixed;top:70px;right:74px;width:min(300px,calc(100% - 20px));max-height:calc(100% - 270px);overflow:auto;background:rgba(255,247,234,.97);border-radius:18px;font-size:12.5px;z-index:8;box-shadow:var(--shadow);display:none;border:2px solid #f0dcb8;animation:pop .35s var(--spring)}
#pe h3{margin:0;padding:10px 12px;font:800 15px var(--head);color:var(--navy);display:flex;gap:6px;align-items:center;position:sticky;top:0;background:linear-gradient(#fff8ec,#fbecd2);border-radius:16px 16px 0 0}
#pe h3 input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px dashed #e0c9a0;color:var(--navy);font:inherit}
#pe .b{padding:4px 12px 12px}#pe label{display:flex;align-items:center;gap:6px;margin:5px 0}#pe label span{width:62px;color:#7a6a55;flex:none;font-weight:700}
#pe input[type=number]{width:0;flex:1;background:#fff;color:var(--navy);border:2px solid #ead8b8;border-radius:9px;padding:4px 6px;font:inherit}
#pe .sec{color:#9a7b50;margin-top:10px;font:800 11px var(--head);text-transform:uppercase;letter-spacing:.08em}#pe .dim{color:#7a6a55;margin:4px 0}
#pe .row{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}#pe button{border:0;border-radius:10px;padding:6px 10px;font:800 12px var(--head);cursor:pointer;background:linear-gradient(#ffffff,#f1e2c8);color:var(--navy);box-shadow:0 2px 0 #d9c19a}
#pe button:hover{transform:translateY(-1px)}#pe .sw{width:24px;height:24px;border-radius:7px;padding:0;border:2px solid #fff;box-shadow:0 1px 3px #0004}#pe input[type=color]{width:34px;height:26px;padding:0;border:0;background:none}
/* clock + time of day */
#clock{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:10px;background:rgba(255,247,234,.94);border-radius:999px;padding:5px 8px 5px 6px;box-shadow:var(--shadow);border:2px solid #f0dcb8}
#clock svg.dial{width:46px;height:46px}#clock .ct{font:800 20px var(--head);color:var(--navy);min-width:62px;line-height:1}#clock .ct small{display:block;font:700 11px var(--body);color:#8a7558}
#clock button{border:0;background:linear-gradient(#fff,#f1e2c8);border-radius:12px;padding:6px 9px;font:800 12px var(--head);color:var(--navy);cursor:pointer;box-shadow:0 2px 0 #d9c19a}
#clock button.on{background:linear-gradient(#ffe08a,#f6b93b);box-shadow:0 2px 0 #c98a12}
body.night #clock,body.night #chip,body.night #info,body.night #status{background:rgba(24,32,58,.93);border-color:#3b4a78;color:#e6ecff}
body.night #status .sg{background:rgba(255,255,255,.07);border-color:#3b4a78}body.night #dock{background:rgba(24,32,58,.9);border-color:#3b4a78}body.night .dk span{color:#dfe6ff}
body.night #clock .ct,body.night #status .sv{color:#f3f6ff}body.night #clock .ct small,body.night #status .sl{color:#a9b6dc}
/* submenus */
.sub{display:flex;gap:6px;margin:-2px 0 10px;padding:4px;background:#f6e7cc;border-radius:14px}.sub button{flex:1;border:0;background:transparent;border-radius:11px;padding:7px 6px;font:800 13px var(--head);color:#7a6040;cursor:pointer}
.sub button.on{background:#fff;color:var(--navy);box-shadow:0 2px 0 #e0c9a0}
.dkm{position:fixed;z-index:9;background:rgba(255,247,234,.98);border-radius:16px;box-shadow:var(--shadow);border:2px solid #f0dcb8;padding:6px;min-width:190px;animation:pop .25s var(--spring)}
.dkm button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;border-radius:11px;padding:8px 10px;font:800 13.5px var(--head);color:var(--navy);cursor:pointer;text-align:left}
.dkm button:hover{background:#fdecc8}.dkm button svg{width:26px;height:26px}.dkm button small{display:block;font:600 11px var(--body);color:#8a7558}
.dk .more{position:absolute;top:-4px;left:-4px;width:20px;height:20px;border-radius:50%;background:#fff;color:#16213e;font:900 11px/20px var(--head);text-align:center;font-style:normal;box-shadow:0 2px 4px #0003;opacity:0;transition:.2s}.dk:hover .more{opacity:1}
#ld.out{opacity:0;transition:opacity .45s;pointer-events:none}
#mload{position:fixed;left:14px;bottom:86px;z-index:70;display:flex;align-items:center;gap:10px;background:rgba(22,33,62,.86);color:#fff;border-radius:999px;padding:6px 14px 6px 6px;font:700 12.5px var(--body);box-shadow:var(--shadow);backdrop-filter:blur(8px);transition:opacity .6s,transform .6s}
#mload svg{width:34px;height:34px;transform:rotate(-90deg)}#mload b{font:800 13px var(--head);display:block}#mload.done{opacity:0;transform:translateY(12px);pointer-events:none}
#menu #mload,body.menu #mload{bottom:16px}
</style>
</head>
